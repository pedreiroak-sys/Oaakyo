                  PearlEl() {
                      super("pearl", "Cooldown da pérola", "Recarga da ender pearl (aparece só enquanto recarrega)",
                              false, 1, 2, 0, -60);
                  }

                  @Override
                  public void measure(MinecraftClient mc, boolean pv) {
                      p = 0f;
                      if (mc.player != null) {
                          p = mc.player.getItemCooldownManager().getCooldownProgress(Items.ENDER_PEARL, 0f);
                      }
                      if (pv && p <= 0f) {
                          p = 0.6f;
                      }
                      if (p <= 0f) {
                          w = 0;
                          h = 0;
                          return;
                      }
                      w = 74;
                      h = 22;
                  }

                  @Override
                  public void draw(DrawContext ctx, MinecraftClient mc, boolean pv) {
                      Theme.panel(ctx, w, h, slot().bg);
                      ctx.drawItem(new ItemStack(Items.ENDER_PEARL), PAD, 3);
                      int bx = PAD + 20;
                      int bw = w - bx - PAD;
                      ctx.fill(bx, 8, bx + bw, 13, 0xFF2A2A33);
                      ctx.fill(bx, 8, bx + Math.round(bw * (1f - p)), 13, Theme.accent());
                  }
              }

              // ------------------------------------------------------------------ item na mão

              static final class HeldEl extends HudElement {
                  private ItemStack stack = ItemStack.EMPTY;
                  private String name = "";
                  private String dur = "";

                  HeldEl() {
                      super("held", "Item na mão", "Nome e durabilidade do item que você segura", false, 1, 2, 110, -4);
                  }

                  @Override
                  public void measure(MinecraftClient mc, boolean pv) {
                      stack = mc.player == null ? ItemStack.EMPTY : mc.player.getMainHandStack();
                      if (stack.isEmpty() && pv) {
                          stack = new ItemStack(Items.DIAMOND_SWORD);
                          stack.setDamage(300);
                      }
                      if (stack.isEmpty()) {
                          w = 0;
                          h = 0;
                          return;
                      }
                      TextRenderer tr = mc.textRenderer;
                      name = tr.trimToWidth(stack.getName().getString(), 110);
                      if (stack.isDamageable()) {
                          dur = (stack.getMaxDamage() - stack.getDamage()) + "/" + stack.getMaxDamage();
                      } else {
                          dur = stack.getCount() > 1 ? "x" + stack.getCount() : "";
                      }
                      w = PAD * 2 + 20 + Math.max(tr.getWidth(name), tr.getWidth(dur));
                      h = 24;
                  }

                  @Override
                  public void draw(DrawContext ctx, MinecraftClient mc, boolean pv) {
                      TextRenderer tr = mc.textRenderer;
                      Theme.panel(ctx, w, h, slot().bg);
                      ctx.drawItem(stack, PAD, 4);
                      Theme.text(ctx, tr, name, PAD + 20, 4, Theme.WHITE);
                      if (!dur.isEmpty()) {
                          Theme.text(ctx, tr, dur, PAD + 20, 14, ArmorEl.color(stack, NovaConfig.INSTANCE));
                      }
                  }
              }

              // ------------------------------------------------------------------ inventário na tela

              static final class InventoryEl extends HudElement {
                  InventoryEl() {
                      super("inventory", "Inventário", "Mostra seus 27 slots de inventário na tela", false, 1, 2, 0, -50);
                  }

                  @Override
                  public void measure(MinecraftClient mc, boolean pv) {
                      w = PAD * 2 + 9 * 18 - 2;
                      h = PAD * 2 - 2 + 3 * 18;
                  }

                  @Override
                  public void draw(DrawContext ctx, MinecraftClient mc, boolean pv) {
                      TextRenderer tr = mc.textRenderer;
                      Theme.panel(ctx, w, h, slot().bg);
                      for (int r = 0; r < 3; r++) {
                          for (int c = 0; c < 9; c++) {
                              int x = PAD + c * 18;
                              int y = PAD - 1 + r * 18;
                              ctx.fill(x, y, x + 16, y + 16, 0x22FFFFFF);
                              if (mc.player != null && !pv) {
                                  ItemStack s = mc.player.getInventory().main.get(9 + r * 9 + c);
                                  if (!s.isEmpty()) {
                                      ctx.drawItem(s, x, y);
                                      ctx.drawItemInSlot(tr, s, x, y);
                                  }
                              }
                          }
                      }
                  }
              }

              // ------------------------------------------------------------------ minimapa

              static final class MinimapEl extends HudElement {
                  MinimapEl() {
                      super("minimap", "Minimapa", "Mapa do terreno ao redor com jogadores e waypoints", true, 2, 0, -4, 4);
                  }

                  @Override
                  public void measure(MinecraftClient mc, boolean pv) {
                      int size = NovaConfig.INSTANCE.minimapSize;
                      w = size + 2;
                      h = size + 2;
