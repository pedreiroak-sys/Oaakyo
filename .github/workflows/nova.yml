name: Nova Client Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Criar arquivos do projeto
        run: |
          cat > 'settings.gradle' <<'NOVA_EOF_MARKER'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          NOVA_EOF_MARKER
          cat > 'gradle.properties' <<'NOVA_EOF_MARKER'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Minecraft 1.20.1
          minecraft_version=1.20.1
          yarn_mappings=1.20.1+build.10
          loader_version=0.15.11

          # Mod
          mod_version=1.4.0
          maven_group=com.novaclient
          archives_base_name=novaclient

          # Fabric API
          fabric_version=0.92.2+1.20.1
          NOVA_EOF_MARKER
          cat > 'build.gradle' <<'NOVA_EOF_MARKER'
          plugins {
              id 'fabric-loom' version '1.6-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 17
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          NOVA_EOF_MARKER
          mkdir -p 'src/main/java/com/novaclient'
          cat > 'src/main/java/com/novaclient/Combat.java' <<'NOVA_EOF_MARKER'
          package com.novaclient;

          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.particle.ParticleTypes;
          import net.minecraft.util.ActionResult;
          import net.minecraft.util.math.Box;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.util.math.Vec3d;

          import java.util.Locale;

          /**
           * Acompanha os golpes do jogador: alcance (reach), combo e alvo atual.
           * Só lê informação (não altera nada do combate).
           */
          public final class Combat {
              private static double reach = -1;
              private static long reachTime = 0;
              private static int combo = 0;
              private static long comboTime = 0;
              private static LivingEntity target = null;
              private static long targetTime = 0;
              private static int lastHurt = 0;

              private Combat() {
              }

              public static void init() {
                  AttackEntityCallback.EVENT.register((player, world, hand, entity, hit) -> {
                      if (!world.isClient()) {
                          return ActionResult.PASS;
                      }
                      MinecraftClient mc = MinecraftClient.getInstance();
                      if (player != mc.player || !entity.isAttackable()) {
                          return ActionResult.PASS;
                      }
                      long now = System.currentTimeMillis();

                      // distância até o ponto mais próximo da hitbox
                      Vec3d eye = player.getEyePos();
                      Box box = entity.getBoundingBox();
                      double cx = MathHelper.clamp(eye.x, box.minX, box.maxX);
                      double cy = MathHelper.clamp(eye.y, box.minY, box.maxY);
                      double cz = MathHelper.clamp(eye.z, box.minZ, box.maxZ);
                      reach = eye.distanceTo(new Vec3d(cx, cy, cz));
                      reachTime = now;

                      int pm = NovaConfig.INSTANCE.hitParticles;
                      if (pm > 0 && entity instanceof LivingEntity) {
                          for (int i = 0; i < NovaConfig.INSTANCE.hitParticleCount; i++) {
                              if (pm == 1 || pm == 3) {
                                  mc.particleManager.addEmitter(entity, ParticleTypes.CRIT);
                              }
                              if (pm == 2 || pm == 3) {
                                  mc.particleManager.addEmitter(entity, ParticleTypes.ENCHANTED_HIT);
                              }
                          }
                      }

                      if (entity instanceof LivingEntity le) {
                          target = le;
                          targetTime = now;
                          if (now - comboTime > 3000L) {
                              combo = 0;
                          }
                          combo++;
                          comboTime = now;
                      }
                      return ActionResult.PASS;
                  });
              }

              public static void tick(MinecraftClient mc) {
                  if (mc.player == null) {
                      combo = 0;
                      target = null;
                      lastHurt = 0;
                      return;
                  }
                  int h = mc.player.hurtTime;
                  if (h > lastHurt) {
                      combo = 0; // levou dano: o combo acaba
                  }
                  lastHurt = h;
              }

              public static String reachText() {
                  if (reach < 0) {
                      return "-";
                  }
                  return String.format(Locale.ROOT, "%.2f", reach);
              }

              public static boolean reachRecent() {
                  return reach >= 0 && System.currentTimeMillis() - reachTime < 4000L;
              }

              public static int combo() {
                  if (System.currentTimeMillis() - comboTime > 3000L) {
                      combo = 0;
                  }
                  return combo;
              }

              /** Alvo para o Target HUD: quem está na mira ou o último golpeado há pouco tempo. */
              public static LivingEntity target(MinecraftClient mc) {
                  if (mc.targetedEntity instanceof LivingEntity le && le != mc.player && le.isAlive()) {
                      return le;
                  }
                  long now = System.currentTimeMillis();
                  if (target != null && now - targetTime < 5000L && target.isAlive() && !target.isRemoved()) {
                      return target;
                  }
                  return null;
              }
          }
          NOVA_EOF_MARKER
          mkdir -p 'src/main/java/com/novaclient'
          cat > 'src/main/java/com/novaclient/HudEditorScreen.java' <<'NOVA_EOF_MARKER'
          package com.novaclient;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.sound.PositionedSoundInstance;
          import net.minecraft.sound.SoundEvents;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          import java.util.ArrayList;
          import java.util.List;

          /**
           * Editor de layout: arraste qualquer elemento do HUD para onde quiser.
           * Tem ímã nas bordas, no centro e nos outros elementos, e botões para tamanho, fundo e ajuste fino.
           */
          public class HudEditorScreen extends Screen {
              private static final float SNAP = 4f;

              private final Screen parent;
              private HudElement sel;
              private boolean dragging;
              private float grabX;
              private float grabY;
              private float vw;
              private float vh;
              private float g = 1f;
              private float guideX = -1;
              private float guideY = -1;

              private int tbX;
              private int tbY;
              private int tbW;
              private int tbH;
              private final List<Btn> btns = new ArrayList<>();

              private record Btn(String label, int x, int y, int w, int h, Runnable run, boolean highlight) {
              }

              public HudEditorScreen(Screen parent, HudElement selected) {
                  super(Text.literal("Editar HUD"));
                  this.parent = parent;
                  this.sel = selected;
              }

              /** Abre o editor (selected pode ser null). */
              public static void open(HudElement selected) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  mc.setScreen(new HudEditorScreen(mc.currentScreen, selected));
              }

              // ------------------------------------------------------------------ desenho

              @Override
              public void render(DrawContext ctx, int mouseX, int mouseY, float delta) {
                  NovaConfig cfg = NovaConfig.INSTANCE;
                  int accent = Theme.accent();
                  g = cfg.hudScalePercent / 100f;
                  vw = width / g;
                  vh = height / g;

                  ctx.fill(0, 0, width, height, 0x66000000);

                  ctx.getMatrices().push();
                  ctx.getMatrices().scale(g, g, 1f);
                  HudRenderer.drawAll(ctx, client, true, vw, vh);

                  // guias de alinhamento
                  if (dragging && sel != null) {
                      if (guideX >= 0) {
                          ctx.fill(Math.round(guideX), 0, Math.round(guideX) + 1, Math.round(vh), 0xAAFFFFFF);
                          ctx.fill(Math.round(guideX + sel.bw) - 1, 0, Math.round(guideX + sel.bw), Math.round(vh), 0x66FFFFFF);
                      }
                      if (guideY >= 0) {
                          ctx.fill(0, Math.round(guideY), Math.round(vw), Math.round(guideY) + 1, 0xAAFFFFFF);
                          ctx.fill(0, Math.round(guideY + sel.bh) - 1, Math.round(vw), Math.round(guideY + sel.bh), 0x66FFFFFF);
                      }
                  }

                  for (HudElement el : HudElements.ALL) {
                      if (el.bw <= 0) {
                          continue;
                      }
                      boolean s = el == sel;
                      int col = s ? accent : (el.slot().on ? 0x99FFFFFF : 0x66FFFFFF);
                      Theme.outline(ctx, el.bx - 1, el.by - 1, el.bx + el.bw + 1, el.by + el.bh + 1, col);
                      if (s) {
                          ctx.fill(el.bx - 3, el.by - 3, el.bx + 1, el.by + 1, accent);
                          ctx.fill(el.bx + el.bw - 1, el.by - 3, el.bx + el.bw + 3, el.by + 1, accent);
                          ctx.fill(el.bx - 3, el.by + el.bh - 1, el.bx + 1, el.by + el.bh + 3, accent);
                          ctx.fill(el.bx + el.bw - 1, el.by + el.bh - 1, el.bx + el.bw + 3, el.by + el.bh + 3, accent);
                          int tw = textRenderer.getWidth(el.title) + 6;
                          int ty = el.by >= 12 ? el.by - 12 : el.by + el.bh + 3;
                          ctx.fill(el.bx, ty, el.bx + tw, ty + 10, accent);
                          ctx.drawText(textRenderer, el.title, el.bx + 3, ty + 1, Theme.onAccent(accent), false);
                      }
                  }
                  ctx.getMatrices().pop();

                  drawToolbar(ctx, mouseX, mouseY, accent);
                  super.render(ctx, mouseX, mouseY, delta);
              }

              private void drawToolbar(DrawContext ctx, int mx, int my, int accent) {
                  btns.clear();
                  tbW = Math.min(width - 8, 320);
                  tbX = (width - tbW) / 2;
                  tbH = sel != null ? 58 : 34;
                  boolean top = sel != null && (sel.by + sel.bh / 2f) * g > height / 2f;
                  tbY = top ? 4 : height - tbH - 4;

                  Theme.rounded(ctx, tbX - 1, tbY - 1, tbX + tbW + 1, tbY + tbH + 1, Theme.BORDER);
                  Theme.rounded(ctx, tbX, tbY, tbX + tbW, tbY + tbH, 0xEE101015);

                  if (sel == null) {
                      Theme.scaled(ctx, textRenderer, "Toque e arraste um elemento para mover", tbX + tbW / 2f, tbY + 8, 0.8f,
                              Theme.GRAY, false, Theme.CENTER);
                      row(ctx, mx, my, accent, tbY + 16, new String[]{"Concluir"}, new Runnable[]{this::close}, 0);
                      return;
                  }

                  NovaConfig.Slot s = sel.slot();
                  Theme.scaled(ctx, textRenderer, sel.title + "  ·  " + s.scale + "%  ·  " + (s.on ? "ligado" : "desligado"),
                          tbX + tbW / 2f, tbY + 8, 0.85f, Theme.WHITE, true, Theme.CENTER);
                  row(ctx, mx, my, accent, tbY + 16,
                          new String[]{"- Tam", "+ Tam", "Fundo", s.on ? "Desligar" : "Ligar", "Resetar"},
                          new Runnable[]{
                                  () -> scale(-10),
                                  () -> scale(10),
                                  () -> {
                                      s.bg = !s.bg;
                                      NovaConfig.save();
                                  },
                                  () -> {
                                      s.on = !s.on;
                                      NovaConfig.save();
                                  },
                                  () -> NovaConfig.INSTANCE.resetSlot(sel)
                          }, s.on ? -1 : 3);
                  row(ctx, mx, my, accent, tbY + 37,
                          new String[]{"<", "^", "v", ">", "Concluir"},
                          new Runnable[]{
                                  () -> nudge(-1, 0),
                                  () -> nudge(0, -1),
                                  () -> nudge(0, 1),
                                  () -> nudge(1, 0),
                                  this::close
                          }, 4);
              }

              private void row(DrawContext ctx, int mx, int my, int accent, int y, String[] labels, Runnable[] runs,
                               int highlight) {
                  int n = labels.length;
                  int gap = 3;
                  int bw = (tbW - 8 - gap * (n - 1)) / n;
                  for (int i = 0; i < n; i++) {
                      int bx = tbX + 4 + i * (bw + gap);
                      boolean hv = mx >= bx && mx < bx + bw && my >= y && my < y + 16;
                      boolean hl = i == highlight;
                      int bg = hl ? (hv ? Theme.mix(accent, Theme.WHITE, 0.2f) : accent)
                              : (hv ? Theme.CARD_HOVER : Theme.CARD);
                      Theme.rounded(ctx, bx, y, bx + bw, y + 16, bg);
                      Theme.scaled(ctx, textRenderer, labels[i], bx + bw / 2f, y + 8, 0.8f,
                              hl ? Theme.onAccent(accent) : Theme.WHITE, true, Theme.CENTER);
                      btns.add(new Btn(labels[i], bx, y, bw, 16, runs[i], hl));
                  }
              }

              // ------------------------------------------------------------------ ações

              private void scale(int d) {
                  if (sel == null) {
                      return;
                  }
                  NovaConfig.Slot s = sel.slot();
                  s.scale = Math.max(50, Math.min(300, s.scale + d));
                  NovaConfig.save();
              }

              private void nudge(int dx, int dy) {
                  if (sel == null) {
                      return;
                  }
                  place(sel, sel.bx + dx, sel.by + dy);
                  NovaConfig.save();
              }

              /** Converte a posição (x, y) em âncora + deslocamento e salva no slot. */
              private void place(HudElement el, float nx, float ny) {
                  int w = el.bw;
                  int h = el.bh;
                  nx = Math.max(0, Math.min(Math.max(0, vw - w), nx));
                  ny = Math.max(0, Math.min(Math.max(0, vh - h), ny));
                  NovaConfig.Slot s = el.slot();
                  float cx = nx + w / 2f;
                  float cy = ny + h / 2f;
                  s.ax = cx < vw / 3f ? 0 : (cx > vw * 2f / 3f ? 2 : 1);
                  s.ay = cy < vh / 3f ? 0 : (cy > vh * 2f / 3f ? 2 : 1);
                  s.dx = Math.round(nx - (vw - w) * s.ax / 2f);
                  s.dy = Math.round(ny - (vh - h) * s.ay / 2f);
              }

              private void click() {
                  if (client != null) {
                      client.getSoundManager().play(PositionedSoundInstance.master(SoundEvents.UI_BUTTON_CLICK, 1.0f));
                  }
              }

              // ------------------------------------------------------------------ entrada

              @Override
              public boolean mouseClicked(double mx, double my, int button) {
                  if (button != 0) {
                      return super.mouseClicked(mx, my, button);
                  }
                  for (Btn b : btns) {
                      if (mx >= b.x() && mx < b.x() + b.w() && my >= b.y() && my < b.y() + b.h()) {
                          click();
                          b.run().run();
                          return true;
                      }
                  }
                  if (mx >= tbX && mx < tbX + tbW && my >= tbY && my < tbY + tbH) {
                      return true;
                  }
                  float vx = (float) (mx / g);
                  float vy = (float) (my / g);
                  HudElement hit = null;
                  for (int i = HudElements.ALL.size() - 1; i >= 0; i--) {
                      HudElement el = HudElements.ALL.get(i);
                      if (el.bw > 0 && vx >= el.bx && vx < el.bx + el.bw && vy >= el.by && vy < el.by + el.bh) {
                          hit = el;
                          break;
                      }
                  }
                  sel = hit;
                  dragging = hit != null;
                  if (hit != null) {
                      grabX = vx - hit.bx;
                      grabY = vy - hit.by;
                  }
                  guideX = -1;
                  guideY = -1;
                  return true;
              }

              @Override
              public boolean mouseDragged(double mx, double my, int button, double dx, double dy) {
                  if (dragging && sel != null) {
                      float nx = (float) (mx / g) - grabX;
                      float ny = (float) (my / g) - grabY;
                      float w = sel.bw;
                      float h = sel.bh;

                      // ímã horizontal
                      float bestX = nx;
                      float bestDx = SNAP + 1f;
                      guideX = -1;
                      List<Float> xs = new ArrayList<>();
                      xs.add(0f);
                      xs.add(vw - w);
                      xs.add((vw - w) / 2f);
                      List<Float> ys = new ArrayList<>();
                      ys.add(0f);
                      ys.add(vh - h);
                      ys.add((vh - h) / 2f);
                      for (HudElement o : HudElements.ALL) {
                          if (o == sel || o.bw <= 0 || !o.slot().on) {
                              continue;
                          }
                          xs.add((float) o.bx);
                          xs.add((float) (o.bx + o.bw) - w);
                          xs.add((float) (o.bx + o.bw) + 2f);
                          xs.add((float) o.bx - w - 2f);
                          xs.add(o.bx + o.bw / 2f - w / 2f);
                          ys.add((float) o.by);
                          ys.add((float) (o.by + o.bh) - h);
                          ys.add((float) (o.by + o.bh) + 2f);
                          ys.add((float) o.by - h - 2f);
                          ys.add(o.by + o.bh / 2f - h / 2f);
                      }
                      for (float c : xs) {
                          float d = Math.abs(nx - c);
                          if (d < bestDx) {
                              bestDx = d;
                              bestX = c;
                          }
                      }
                      if (bestDx <= SNAP) {
                          nx = bestX;
                          guideX = bestX;
                      }
                      float bestY = ny;
                      float bestDy = SNAP + 1f;
                      guideY = -1;
                      for (float c : ys) {
                          float d = Math.abs(ny - c);
                          if (d < bestDy) {
                              bestDy = d;
                              bestY = c;
                          }
                      }
                      if (bestDy <= SNAP) {
                          ny = bestY;
                          guideY = bestY;
                      }
                      place(sel, nx, ny);
                      return true;
                  }
                  return super.mouseDragged(mx, my, button, dx, dy);
              }

              @Override
              public boolean mouseReleased(double mx, double my, int button) {
                  if (dragging) {
                      dragging = false;
                      guideX = -1;
                      guideY = -1;
                      NovaConfig.save();
                      return true;
                  }
                  return super.mouseReleased(mx, my, button);
              }

              @Override
              public boolean keyPressed(int keyCode, int scanCode, int modifiers) {
                  if (sel != null) {
                      switch (keyCode) {
                          case GLFW.GLFW_KEY_LEFT -> {
                              nudge(-1, 0);
                              return true;
                          }
                          case GLFW.GLFW_KEY_RIGHT -> {
                              nudge(1, 0);
                              return true;
                          }
                          case GLFW.GLFW_KEY_UP -> {
                              nudge(0, -1);
                              return true;
                          }
                          case GLFW.GLFW_KEY_DOWN -> {
                              nudge(0, 1);
                              return true;
                          }
                          default -> {
                          }
                      }
                  }
                  return super.keyPressed(keyCode, scanCode, modifiers);
              }

              @Override
              public void removed() {
                  NovaConfig.save();
              }

              @Override
              public void close() {
                  if (client != null) {
                      client.setScreen(parent);
                  }
              }
          }
          NOVA_EOF_MARKER
          mkdir -p 'src/main/java/com/novaclient'
          cat > 'src/main/java/com/novaclient/HudElement.java' <<'NOVA_EOF_MARKER'
          package com.novaclient;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;

          /**
           * Um elemento do HUD que pode ser ligado, redimensionado e arrastado para qualquer lugar da tela.
           */
          public abstract class HudElement {
              public static final int PAD = 5;

              public final String id;
              public final String title;
              public final String desc;

              private final boolean defOn;
              private final int defAx;
              private final int defAy;
              private final int defDx;
              private final int defDy;

              /** Última área desenhada (coordenadas do HUD, já com a escala do elemento). */
              public int bx;
              public int by;
              public int bw;
              public int bh;

              /** Tamanho sem escala, preenchido em measure(). */
              protected int w;
              protected int h;

              protected HudElement(String id, String title, String desc, boolean on, int ax, int ay, int dx, int dy) {
                  this.id = id;
                  this.title = title;
                  this.desc = desc;
                  this.defOn = on;
                  this.defAx = ax;
                  this.defAy = ay;
                  this.defDx = dx;
                  this.defDy = dy;
              }

              /** Elementos escondidos nem aparecem no editor (ex.: armadura inteira quando está separada em peças). */
              public boolean hidden() {
                  return false;
              }

              public int width() {
                  return w;
              }

              public int height() {
                  return h;
              }

              public NovaConfig.Slot defaultSlot() {
                  NovaConfig.Slot s = new NovaConfig.Slot();
                  s.on = defOn;
                  s.ax = defAx;
                  s.ay = defAy;
                  s.dx = defDx;
                  s.dy = defDy;
                  return s;
              }

              public NovaConfig.Slot slot() {
                  return NovaConfig.INSTANCE.slot(this);
              }

              /** Calcula w e h. pv = modo de pré-visualização (editor ou fora de um mundo): usar dados de exemplo. */
              public abstract void measure(MinecraftClient mc, boolean pv);

              /** Desenha em (0,0) usando w e h calculados em measure(). */
              public abstract void draw(DrawContext ctx, MinecraftClient mc, boolean pv);
          }
          NOVA_EOF_MARKER
          mkdir -p 'src/main/java/com/novaclient'
          cat > 'src/main/java/com/novaclient/HudElements.java' <<'NOVA_EOF_MARKER'
          package com.novaclient;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.effect.StatusEffectInstance;
          import net.minecraft.entity.player.PlayerInventory;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.potion.Potion;
          import net.minecraft.potion.PotionUtil;
          import net.minecraft.potion.Potions;
          import net.minecraft.util.math.Direction;

          import java.time.LocalTime;
          import java.time.format.DateTimeFormatter;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          /**
           * Todos os elementos do HUD do Nova Client.
           */
          public final class HudElements {
              public static final List<HudElement> ALL = new ArrayList<>();

              private static final DateTimeFormatter CLOCK = DateTimeFormatter.ofPattern("HH:mm:ss");
              private static final int ARMOR_ROW_H = 18;
              private static final long START = System.currentTimeMillis();

              private HudElements() {
              }

              public static HudElement byId(String id) {
                  for (HudElement e : ALL) {
                      if (e.id.equals(id)) {
                          return e;
                      }
                  }
                  throw new IllegalArgumentException("Elemento desconhecido: " + id);
              }

              public static boolean minimapOn() {
                  return byId("minimap").slot().on;
              }

              static {
                  // coluna de informações no topo esquerdo
                  ALL.add(new TextEl("fps", "FPS", "Quadros por segundo", true, 0, 0, 4, 4,
