          package com.novaclient;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.CloudRenderMode;
          import net.minecraft.client.option.GraphicsMode;
          import net.minecraft.client.option.ParticlesMode;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.function.BooleanSupplier;
          import java.util.function.Consumer;
          import java.util.function.IntConsumer;
          import java.util.function.IntSupplier;
          import java.util.function.Supplier;

          /**
           * Lista de módulos mostrada no menu (cartões) e as opções de cada um.
           */
          public final class Mods {
              public enum Cat {
                  HUD("HUD", Items.COMPASS),
                  PVP("PvP", Items.DIAMOND_SWORD),
                  VISUAL("Visual", Items.ENDER_EYE),
                  MOVE("Mover", Items.DIAMOND_BOOTS),
                  PERF("Desempenho", Items.REDSTONE),
                  LAYOUT("Layout", Items.ITEM_FRAME),
                  THEME("Tema", Items.PAINTING);

                  public final String label;
                  public final ItemStack icon;

                  Cat(String label, Item item) {
                      this.label = label;
                      this.icon = new ItemStack(item);
                  }
              }

              /** Uma opção dentro da página de configuração de um módulo. */
              public static final class Opt {
                  public enum Kind { TOGGLE, STEP, SLIDER, ACTION }

                  public final Kind kind;
                  public final String label;
                  public BooleanSupplier get;
                  public Consumer<Boolean> set;
                  public Supplier<String> text;
                  public Runnable dec;
                  public Runnable inc;
                  public Runnable run;
                  public int min;
                  public int max;
                  public int step = 1;
                  public String unit = "";
                  public IntSupplier iget;
                  public IntConsumer iset;

                  private Opt(Kind kind, String label) {
                      this.kind = kind;
                      this.label = label;
                  }

                  public static Opt toggle(String label, BooleanSupplier get, Consumer<Boolean> set) {
                      Opt o = new Opt(Kind.TOGGLE, label);
                      o.get = get;
                      o.set = set;
                      return o;
                  }

                  public static Opt step(String label, Supplier<String> text, Runnable dec, Runnable inc) {
                      Opt o = new Opt(Kind.STEP, label);
                      o.text = text;
                      o.dec = dec;
                      o.inc = inc;
                      return o;
                  }

                  public static Opt cycle(String label, String[] names, IntSupplier get, IntConsumer set) {
                      int n = names.length;
                      return step(label,
                              () -> names[Math.floorMod(get.getAsInt(), n)],
                              () -> set.accept(Math.floorMod(get.getAsInt() - 1, n)),
                              () -> set.accept(Math.floorMod(get.getAsInt() + 1, n)));
                  }

                  public static Opt slider(String label, int min, int max, int step, String unit,
                                           IntSupplier get, IntConsumer set) {
                      Opt o = new Opt(Kind.SLIDER, label);
                      o.min = min;
                      o.max = max;
                      o.step = step;
                      o.unit = unit;
                      o.iget = get;
                      o.iset = set;
                      return o;
                  }

                  public static Opt action(String label, Runnable run) {
                      Opt o = new Opt(Kind.ACTION, label);
                      o.run = run;
                      return o;
                  }
              }

              public static final class Mod {
                  public final String name;
                  public final String desc;
                  public final Cat cat;
                  /** null = módulo sem liga/desliga (o cartão abre as opções). */
                  public BooleanSupplier get;
                  public Consumer<Boolean> set;
                  /** Se não for null, tocar no cartão executa isto. */
                  public Runnable action;
                  public final List<Opt> opts = new ArrayList<>();
                  public ItemStack icon = new ItemStack(Items.PAPER);

                  Mod icon(Item item) {
                      this.icon = new ItemStack(item);
                      return this;
                  }

                  Mod(String name, String desc, Cat cat) {
                      this.name = name;
                      this.desc = desc;
                      this.cat = cat;
                  }

                  public boolean hasToggle() {
                      return get != null;
                  }

                  public boolean enabled() {
                      return get != null && get.getAsBoolean();
                  }

                  public void toggle() {
                      if (get != null) {
                          set.accept(!get.getAsBoolean());
                          NovaConfig.save();
                      }
                  }

                  Mod opt(Opt o) {
                      opts.add(o);
                      return this;
                  }
              }

              public static final List<Mod> ALL = new ArrayList<>();

              private static final String[] ARMOR_MODES = {"Número", "Porcentagem", "Número + %", "Só ícone"};
              private static final String[] ARMOR_LAYOUT = {"Vertical", "Horizontal"};
