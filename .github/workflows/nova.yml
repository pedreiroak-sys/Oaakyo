                          ctx.drawCenteredTextWithShadow(mc.textRenderer, "MAPA", w / 2, h / 2 - 4, Theme.WHITE);
                          return;
                      }
                      MinimapRenderer.draw(ctx, mc, 1, 1, size);
                  }
              }
