              // ------------------------------------------------------------------ armadura

              static final class ArmorEl extends HudElement {
                  private final List<ItemStack> items = new ArrayList<>();
                  private static List<ItemStack> sample;

                  ArmorEl() {
                      super("armor", "Armadura", "Durabilidade da armadura e itens", true, 2, 1, -4, 0);
                  }

                  @Override
                  public boolean hidden() {
                      return NovaConfig.INSTANCE.armorSplit;
                  }

                  private static List<ItemStack> sample() {
                      if (sample == null) {
                          sample = new ArrayList<>();
                          ItemStack a = new ItemStack(Items.NETHERITE_HELMET);
                          a.setDamage(60);
                          ItemStack b = new ItemStack(Items.NETHERITE_CHESTPLATE);
                          b.setDamage(200);
                          ItemStack c = new ItemStack(Items.NETHERITE_LEGGINGS);
                          c.setDamage(330);
                          ItemStack d = new ItemStack(Items.NETHERITE_BOOTS);
                          d.setDamage(380);
                          sample.add(a);
                          sample.add(b);
                          sample.add(c);
                          sample.add(d);
                      }
                      return sample;
                  }

                  private void collect(MinecraftClient mc, boolean pv) {
                      items.clear();
                      NovaConfig cfg = NovaConfig.INSTANCE;
                      if (mc.player != null) {
                          for (int slot = 3; slot >= 0; slot--) {
                              ItemStack stack = mc.player.getInventory().getArmorStack(slot);
                              if (!stack.isEmpty()) {
                                  items.add(stack);
                              }
                          }
                          if (cfg.armorShowHands) {
                              ItemStack main = mc.player.getMainHandStack();
                              if (!main.isEmpty()) {
                                  items.add(main);
                              }
                              ItemStack off = mc.player.getOffHandStack();
                              if (!off.isEmpty()) {
                                  items.add(off);
                              }
                          }
                      }
                      if (items.isEmpty() && pv) {
                          items.addAll(sample());
                      }
                  }

                  private static String text(ItemStack s, int mode) {
                      if (mode == 3) {
                          return "";
                      }
                      if (s.isDamageable()) {
                          int max = s.getMaxDamage();
                          int left = max - s.getDamage();
                          int pct = Math.round(left * 100f / max);
                          return switch (mode) {
                              case 0 -> String.valueOf(left);
                              case 1 -> pct + "%";
                              default -> left + " (" + pct + "%)";
                          };
                      }
                      return s.getCount() > 1 ? "x" + s.getCount() : "";
                  }

                  private static int color(ItemStack s, NovaConfig cfg) {
                      if (!cfg.armorColorByDurability || !s.isDamageable()) {
                          return Theme.WHITE;
                      }
                      float p = (s.getMaxDamage() - s.getDamage()) / (float) s.getMaxDamage();
                      if (p > 0.6f) {
                          return Theme.GREEN;
                      }
                      return p > 0.3f ? Theme.YELLOW : Theme.WARN;
                  }

                  private static int cellWidth(TextRenderer tr, ItemStack s, NovaConfig cfg) {
                      return Math.max(18, tr.getWidth(text(s, cfg.armorMode)) + 4);
                  }

                  @Override
                  public void measure(MinecraftClient mc, boolean pv) {
                      collect(mc, pv);
                      if (items.isEmpty()) {
                          w = 0;
                          h = 0;
                          return;
                      }
                      NovaConfig cfg = NovaConfig.INSTANCE;
                      TextRenderer tr = mc.textRenderer;
                      int cw;
                      int ch;
                      if (!cfg.armorHorizontal) {
                          int m = 0;
                          for (ItemStack s : items) {
                              String t = text(s, cfg.armorMode);
                              m = Math.max(m, 18 + (t.isEmpty() ? 0 : tr.getWidth(t)));
                          }
                          cw = m;
                          ch = items.size() * ARMOR_ROW_H;
                      } else {
                          cw = 0;
                          for (ItemStack s : items) {
                              cw += cellWidth(tr, s, cfg);
                          }
                          ch = 18 + (cfg.armorMode == 3 ? 0 : 10);
                      }
                      w = PAD * 2 + cw;
                      h = PAD * 2 - 2 + ch;
                  }

                  @Override
                  public void draw(DrawContext ctx, MinecraftClient mc, boolean pv) {
                      NovaConfig cfg = NovaConfig.INSTANCE;
                      TextRenderer tr = mc.textRenderer;
                      Theme.panel(ctx, w, h, slot().bg);
                      int x = PAD;
                      int y = PAD - 1;
                      if (!cfg.armorHorizontal) {
                          for (ItemStack s : items) {
                              ctx.drawItem(s, x, y);
                              String t = text(s, cfg.armorMode);
                              if (!t.isEmpty()) {
                                  Theme.text(ctx, tr, t, x + 18, y + 4, color(s, cfg));
                              }
                              y += ARMOR_ROW_H;
                          }
                          return;
                      }
                      for (ItemStack s : items) {
                          int cw = cellWidth(tr, s, cfg);
                          ctx.drawItem(s, x + (cw - 16) / 2, y);
                          String t = text(s, cfg.armorMode);
                          if (!t.isEmpty()) {
                              Theme.text(ctx, tr, t, x + (cw - tr.getWidth(t)) / 2, y + 18, color(s, cfg));
                          }
                          x += cw;
                      }
                  }
              }

