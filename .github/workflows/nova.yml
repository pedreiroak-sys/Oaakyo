              private Layouts() {
              }

              public static void apply(int preset) {
                  NovaConfig cfg = NovaConfig.INSTANCE;
                  cfg.resetAllSlots();
                  cfg.armorSplit = false;
                  // começa com tudo desligado e liga só o que o layout usa
                  for (HudElement el : HudElements.ALL) {
                      if (!el.id.startsWith("armor_")) {
                          el.slot().on = false;
                      }
                  }
                  switch (preset) {
                      case 0 -> {
                          put("fps", 0, 0, 4, 4);
                          put("cps", 0, 0, 4, 21);
                          put("armor", 2, 1, -4, 0);
                          put("effects", 2, 0, -4, 4);
                          put("keystrokes", 0, 2, 4, -4);
                          put("reach", 1, 1, 0, 24);
                          put("combo", 1, 1, 0, 41);
                          put("target", 1, 0, 0, 4);
                          put("items", 2, 2, -4, -4);
                          put("pearl", 1, 2, 0, -60);
                      }
                      case 1 -> {
                          put("fps", 0, 0, 4, 4);
                          put("ping", 0, 0, 4, 21);
                          put("cps", 0, 0, 4, 38);
                          put("coords", 0, 0, 4, 55);
                          put("minimap", 2, 0, -4, 4);
                          put("effects", 0, 1, 4, 0);
                          put("armor", 2, 1, -4, 20);
                          put("keystrokes", 0, 2, 4, -4);
                          put("items", 2, 2, -4, -4);
                          put("reach", 1, 1, 0, 24);
                          put("combo", 1, 1, 0, 41);
                          put("target", 1, 0, 0, 4);
                          put("pearl", 1, 2, 0, -60);
                      }
                      case 2 -> {
                          put("fps", 0, 0, 4, 4);
                          put("ping", 0, 0, 4, 21);
                          put("cps", 0, 0, 4, 38);
                          put("coords", 0, 0, 4, 55);
                          put("direction", 0, 0, 4, 72);
                          put("speed", 0, 0, 4, 89);
                          put("minimap", 2, 0, -4, 4);
                          put("effects", 2, 0, -4, 76);
                          put("armor", 2, 1, -4, 0);
                          put("keystrokes", 0, 2, 4, -4);
                          put("items", 2, 2, -4, -4);
                          put("reach", 1, 1, 0, 24);
                          put("combo", 1, 1, 0, 41);
                          put("target", 1, 0, 0, 4);
                          put("pearl", 1, 2, 0, -60);
                          put("held", 1, 2, 110, -4);
                      }
                      default -> {
                      }
                  }
                  NovaConfig.save();
              }

              private static void put(String id, int ax, int ay, int dx, int dy) {
                  NovaConfig.Slot s = HudElements.byId(id).slot();
                  s.on = true;
                  s.ax = ax;
                  s.ay = ay;
                  s.dx = dx;
