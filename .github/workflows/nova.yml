          package com.novaclient;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;

          /**
           * Configuração salva em .minecraft/config/novaclient.json
           */
          public class NovaConfig {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              public static NovaConfig INSTANCE = new NovaConfig();

              /** Waypoint salvo na config. */
              public static class Waypoint {
                  public String name = "WP";
                  public int x, y, z;
                  public String dim = "minecraft:overworld";
                  public int color = 0xFFE11D2E;
              }

              /**
               * Posição e opções de um elemento do HUD.
               * Posição = âncora (0..2 em cada eixo: esquerda/centro/direita, topo/meio/baixo) + deslocamento em pixels.
               * Assim o elemento acompanha o tamanho da tela.
               */
              public static class Slot {
                  public boolean on = true;
                  public int ax = 0;
                  public int ay = 0;
                  public int dx = 4;
                  public int dy = 4;
                  public int scale = 100;
                  public boolean bg = true;
              }

              // ---- Geral / tema
              public boolean hudEnabled = true;
              /** Tamanho geral do HUD em % (60 a 200). */
              public int hudScalePercent = 100;
              /** Índice da cor de destaque (ver Theme.COLOR_NAMES). */
              public int accent = 0;
              /** 0 = barra lateral, 1 = suave (arredondado), 2 = linha embaixo */
              public int style = 0;
              /** Opacidade do fundo dos painéis, 0 a 100 */
              public int bgOpacity = 70;
              public boolean textShadow = true;
              public Map<String, Slot> elements = new LinkedHashMap<>();

              // ---- Armadura
              /** 0 = número, 1 = porcentagem, 2 = número + %, 3 = só ícone */
              public int armorMode = 1;
              public boolean armorHorizontal = false;
              public boolean armorShowHands = false;
              public boolean armorColorByDurability = true;
              /** true = cada peça (capacete, peitoral, calça, bota) vira um elemento separado no HUD. */
              public boolean armorSplit = false;

              // ---- CPS / teclas
              public boolean cpsRight = true;
              public boolean keysMouse = true;
              public boolean keysSpace = true;

              // ---- Contador de itens
              public boolean cntPots = true;
              public boolean cntGap = true;
              public boolean cntTotem = true;
              public boolean cntPearl = false;
              public boolean cntArrows = false;
              public boolean cntCrystal = false;

              // ---- Mira personalizada
              public boolean crosshairEnabled = false;
              /** 0 = cruz, 1 = ponto, 2 = cruz + ponto, 3 = quadrado */
              public int crosshairStyle = 0;
              public int crosshairSize = 5;
              public int crosshairGap = 2;
              public int crosshairThick = 1;
              public int crosshairColor = 7;
              public boolean crosshairOutline = true;
              public boolean crosshairTargetColor = true;
              public boolean crosshairCooldown = false;

              // ---- Minimapa
              /** Tamanho na tela, em pixels (48 a 128). */
              public int minimapSize = 64;
              /** Quantidade de blocos mostrados por lado (32, 48 ou 64). */
              public int minimapCells = 48;
              public boolean minimapPlayers = true;
              public boolean minimapWaypoints = true;

              // ---- Waypoints
              public boolean waypointsInWorld = true;
              public boolean deathWaypoint = true;
              public List<Waypoint> waypoints = new ArrayList<>();

              // ---- Módulos
              public boolean autoSprint = true;
              public boolean toggleSneak = false;
              public boolean fullbright = false;
              public boolean hitDelayFix = true;
              public boolean hitboxes = false;
              public boolean noHurtCam = false;
              /** 0 = normal, 1 = baixo, 2 = sem fogo na tela */
              public int fireMode = 0;
              /** Partículas extras ao bater: 0 = off, 1 = crítico, 2 = afiado, 3 = ambos */
              public int hitParticles = 0;
              /** Quantidade de partículas extras por golpe (1 a 5). */
              public int hitParticleCount = 2;
              /** 0 = normal, 1 = dia, 2 = meio-dia, 3 = pôr do sol, 4 = noite (só visual, no seu cliente) */
              public int timeMode = 0;

              /** FOV usado enquanto o zoom está ativo (30 a 110, menor = mais zoom). */
              public int zoomFov = 30;

              /** 0 = normal, 1 = equilibrado, 2 = máximo */
              public int perfProfile = 0;

              // ------------------------------------------------------------------ slots

              public Slot slot(HudElement el) {
                  if (elements == null) {
                      elements = new LinkedHashMap<>();
                  }
                  Slot s = elements.get(el.id);
                  if (s == null) {
                      s = el.defaultSlot();
                      elements.put(el.id, s);
                  }
                  return s;
              }

              public void resetSlot(HudElement el) {
                  elements.put(el.id, el.defaultSlot());
                  save();
              }

              public void resetAllSlots() {
                  elements.clear();
                  save();
              }

              // ------------------------------------------------------------------ arquivo

              private static Path file() {
                  return FabricLoader.getInstance().getConfigDir().resolve("novaclient.json");
              }

              public static void load() {
                  Path path = file();
                  if (!Files.exists(path)) {
                      save();
                      return;
                  }
                  try (Reader reader = Files.newBufferedReader(path, StandardCharsets.UTF_8)) {
                      NovaConfig loaded = GSON.fromJson(reader, NovaConfig.class);
                      if (loaded != null) {
                          INSTANCE = loaded;
                          INSTANCE.sanitize();
                      }
                  } catch (IOException | RuntimeException e) {
                      System.err.println("[NovaClient] Falha ao ler config, usando padrão: " + e);
                      INSTANCE = new NovaConfig();
                  }
              }

              public static void save() {
                  INSTANCE.sanitize();
                  try {
                      Files.createDirectories(file().getParent());
                      try (Writer writer = Files.newBufferedWriter(file(), StandardCharsets.UTF_8)) {
                          GSON.toJson(INSTANCE, writer);
                      }
                  } catch (IOException e) {
                      System.err.println("[NovaClient] Falha ao salvar config: " + e);
                  }
              }

              private static int clamp(int v, int lo, int hi) {
                  return Math.max(lo, Math.min(hi, v));
              }

              private void sanitize() {
                  hudScalePercent = clamp(hudScalePercent, 60, 200);
                  accent = clamp(accent, 0, Theme.COLOR_NAMES.length - 1);
                  style = Math.floorMod(style, 3);
                  bgOpacity = clamp(bgOpacity, 0, 100);
                  zoomFov = clamp(zoomFov, 30, 110);
                  armorMode = Math.floorMod(armorMode, 4);
                  minimapSize = clamp(minimapSize, 48, 128);
                  minimapCells = clamp(minimapCells, 32, 64);
                  perfProfile = Math.floorMod(perfProfile, 3);
                  fireMode = Math.floorMod(fireMode, 3);
                  hitParticles = Math.floorMod(hitParticles, 4);
                  hitParticleCount = clamp(hitParticleCount, 1, 5);
                  timeMode = Math.floorMod(timeMode, 5);
                  crosshairStyle = Math.floorMod(crosshairStyle, 4);
                  crosshairSize = clamp(crosshairSize, 1, 14);
                  crosshairGap = clamp(crosshairGap, 0, 10);
                  crosshairThick = clamp(crosshairThick, 1, 4);
                  crosshairColor = clamp(crosshairColor, 0, Theme.COLOR_NAMES.length - 1);
                  if (waypoints == null) {
                      waypoints = new ArrayList<>();
                  }
                  if (elements == null) {
                      elements = new LinkedHashMap<>();
                  }
                  for (Slot s : elements.values()) {
                      if (s == null) {
                          continue;
                      }
                      s.ax = Math.floorMod(s.ax, 3);
                      s.ay = Math.floorMod(s.ay, 3);
                      s.scale = clamp(s.scale, 50, 300);
                  }
                  elements.values().removeIf(s -> s == null);
              }
          }
