          package com.novaclient;

          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;

          import java.util.ArrayList;
          import java.util.List;

          /**
           * Cores e utilidades de desenho compartilhadas pelo HUD e pelos menus.
           */
          public final class Theme {
              public static final int[] PALETTE = {
                      0xFFE11D2E, 0xFF3B82F6, 0xFF22C55E, 0xFFF59E0B,
                      0xFFA855F7, 0xFF06B6D4, 0xFFEC4899, 0xFFFFFFFF
              };
              public static final String[] COLOR_NAMES = {
                      "Vermelho", "Azul", "Verde", "Laranja", "Roxo", "Ciano", "Rosa", "Branco", "Arco-íris"
              };

              public static final int WHITE = 0xFFFFFFFF;
              public static final int GRAY = 0xFFA6A6B2;
              public static final int GREEN = 0xFF55FF55;
              public static final int YELLOW = 0xFFFFD84A;
              public static final int WARN = 0xFFFF4D4D;

              // menu
              public static final int PANEL = 0xF40C0C11;
              public static final int SIDEBAR = 0xFF121218;
              public static final int CARD = 0xFF181820;
              public static final int CARD_HOVER = 0xFF21212C;
              public static final int BORDER = 0xFF2A2A37;
              public static final int DIM = 0xAA000000;
              public static final int MUTED = 0xFF8A8A98;
              public static final int OFF_TRACK = 0xFF383846;

              private Theme() {
              }

              public static int color(int idx) {
                  if (idx >= 0 && idx < PALETTE.length) {
                      return PALETTE[idx];
                  }
                  return rainbow();
              }

              public static int accent() {
                  return color(NovaConfig.INSTANCE.accent);
              }

              public static int rainbow() {
                  float h = (System.currentTimeMillis() % 5000L) / 5000f;
                  return hsv(h, 0.75f, 1f);
              }

              private static int hsv(float h, float s, float v) {
                  int i = (int) (h * 6f);
                  float f = h * 6f - i;
                  float p = v * (1f - s);
                  float q = v * (1f - f * s);
                  float t = v * (1f - (1f - f) * s);
                  float r;
                  float g;
                  float b;
                  switch (i % 6) {
                      case 0 -> { r = v; g = t; b = p; }
                      case 1 -> { r = q; g = v; b = p; }
                      case 2 -> { r = p; g = v; b = t; }
                      case 3 -> { r = p; g = q; b = v; }
                      case 4 -> { r = t; g = p; b = v; }
                      default -> { r = v; g = p; b = q; }
                  }
                  return 0xFF000000 | ((int) (r * 255) << 16) | ((int) (g * 255) << 8) | (int) (b * 255);
              }

              public static int withAlpha(int color, int alpha) {
                  return (alpha << 24) | (color & 0x00FFFFFF);
              }

              public static int mix(int a, int b, float t) {
                  int ar = (a >> 16) & 255;
                  int ag = (a >> 8) & 255;
                  int ab = a & 255;
                  int br = (b >> 16) & 255;
                  int bg = (b >> 8) & 255;
                  int bb = b & 255;
                  int r = Math.round(ar + (br - ar) * t);
                  int g = Math.round(ag + (bg - ag) * t);
                  int bl = Math.round(ab + (bb - ab) * t);
                  return 0xFF000000 | (r << 16) | (g << 8) | bl;
              }

              /** Cor de texto legível sobre o destaque (branco ou preto). */
              public static int onAccent(int accent) {
                  int r = (accent >> 16) & 255;
                  int g = (accent >> 8) & 255;
                  int b = accent & 255;
                  return (r * 299 + g * 587 + b * 114) / 1000 > 160 ? 0xFF111114 : WHITE;
              }

              // ------------------------------------------------------------------ desenho

              /** Retângulo com cantos arredondados (sem sobreposição, funciona com cores translúcidas). */
              public static void rounded(DrawContext c, int x1, int y1, int x2, int y2, int color) {
                  c.fill(x1 + 2, y1, x2 - 2, y2, color);
                  c.fill(x1 + 1, y1 + 1, x1 + 2, y2 - 1, color);
                  c.fill(x2 - 2, y1 + 1, x2 - 1, y2 - 1, color);
                  c.fill(x1, y1 + 2, x1 + 1, y2 - 2, color);
                  c.fill(x2 - 1, y1 + 2, x2, y2 - 2, color);
              }

              public static void outline(DrawContext c, int x1, int y1, int x2, int y2, int color) {
                  c.fill(x1, y1, x2, y1 + 1, color);
                  c.fill(x1, y2 - 1, x2, y2, color);
                  c.fill(x1, y1 + 1, x1 + 1, y2 - 1, color);
                  c.fill(x2 - 1, y1 + 1, x2, y2 - 1, color);
              }

              /** Fundo de um painel do HUD, conforme o estilo escolhido. Desenha em (0,0). */
              public static void panel(DrawContext c, int w, int h, boolean bg) {
                  if (!bg) {
                      return;
                  }
                  NovaConfig cfg = NovaConfig.INSTANCE;
                  int a = cfg.bgOpacity * 255 / 100;
                  if (a <= 0) {
                      return;
                  }
                  int col = (a << 24) | 0x101015;
                  switch (cfg.style) {
                      case 1 -> rounded(c, 0, 0, w, h, col);
                      case 2 -> {
                          c.fill(0, 0, w, h, col);
                          c.fill(0, h - 1, w, h, accent());
                      }
                      default -> {
                          c.fill(0, 0, w, h, col);
                          c.fill(0, 0, 2, h, accent());
                      }
                  }
              }

              /** Texto do HUD (respeita a opção de sombra). */
              public static void text(DrawContext c, TextRenderer tr, String s, int x, int y, int color) {
                  c.drawText(tr, s, x, y, color, NovaConfig.INSTANCE.textShadow);
              }

              public static final int LEFT = 0;
              public static final int CENTER = 1;
              public static final int RIGHT = 2;

              /** Texto do menu com escala; cy é o centro vertical. */
              public static void scaled(DrawContext ctx, TextRenderer tr, String s, float x, float cy, float scale,
                                        int color, boolean bold, int align) {
                  Text t = bold ? Text.literal(s).formatted(Formatting.BOLD) : Text.literal(s);
                  int w = tr.getWidth(t);
                  int dx = align == CENTER ? -w / 2 : (align == RIGHT ? -w : 0);
                  ctx.getMatrices().push();
                  ctx.getMatrices().translate(x, cy, 0);
                  ctx.getMatrices().scale(scale, scale, 1f);
                  ctx.drawTextWithShadow(tr, t, dx, -4, color);
                  ctx.getMatrices().pop();
              }

              public static int scaledWidth(TextRenderer tr, String s, float scale, boolean bold) {
                  Text t = bold ? Text.literal(s).formatted(Formatting.BOLD) : Text.literal(s);
                  return Math.round(tr.getWidth(t) * scale);
              }

              /** Quebra o texto em até maxLines linhas que caibam em maxPx (já considerando a escala). */
              public static List<String> wrap(TextRenderer tr, String s, float scale, int maxPx, int maxLines) {
                  int max = Math.round(maxPx / scale);
                  List<String> lines = new ArrayList<>();
                  StringBuilder cur = new StringBuilder();
                  for (String word : s.split(" ")) {
                      String test = cur.length() == 0 ? word : cur + " " + word;
                      if (cur.length() == 0 || tr.getWidth(test) <= max) {
                          cur = new StringBuilder(test);
                      } else {
                          lines.add(cur.toString());
                          cur = new StringBuilder(word);
                      }
                  }
                  if (cur.length() > 0) {
                      lines.add(cur.toString());
                  }
                  if (lines.size() > maxLines) {
                      lines = new ArrayList<>(lines.subList(0, maxLines));
                      lines.set(maxLines - 1, lines.get(maxLines - 1) + "...");
                  }
                  List<String> out = new ArrayList<>();
                  for (String l : lines) {
                      out.add(fit(tr, l, scale, maxPx));
                  }
                  return out;
              }

              /** Corta o texto com "..." para caber em maxPx (já considerando a escala). */
              public static String fit(TextRenderer tr, String s, float scale, int maxPx) {
                  int max = Math.round(maxPx / scale);
                  if (tr.getWidth(s) <= max) {
                      return s;
                  }
                  String cut = tr.trimToWidth(s, Math.max(0, max - tr.getWidth("...")));
                  return cut + "...";
              }
          }
