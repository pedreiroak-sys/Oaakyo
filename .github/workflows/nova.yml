              // ------------------------------------------------------------------ efeitos

              static final class EffectsEl extends HudElement {
                  private final List<String[]> rows = new ArrayList<>();
                  private int labelW;
                  private int valueW;

                  EffectsEl() {
                      super("effects", "Efeitos", "Poções ativas e tempo restante", false, 2, 0, -4, 76);
                  }

                  private static String time(int ticks) {
                      if (ticks > 1_000_000) {
                          return "--:--";
                      }
                      int s = ticks / 20;
                      return String.format(Locale.ROOT, "%d:%02d", s / 60, s % 60);
                  }

                  @Override
                  public void measure(MinecraftClient mc, boolean pv) {
                      rows.clear();
                      if (mc.player != null) {
                          for (StatusEffectInstance e : mc.player.getStatusEffects()) {
                              String name = e.getEffectType().getName().getString();
                              if (e.getAmplifier() > 0) {
                                  name += " " + (e.getAmplifier() + 1);
                              }
                              rows.add(new String[]{name, time(e.getDuration())});
                          }
                      }
                      if (rows.isEmpty() && pv) {
                          rows.add(new String[]{"Velocidade 2", "1:30"});
                          rows.add(new String[]{"Força", "0:45"});
                      }
                      if (rows.isEmpty()) {
                          w = 0;
                          h = 0;
                          return;
                      }
                      TextRenderer tr = mc.textRenderer;
                      labelW = 0;
                      valueW = 0;
                      for (String[] r : rows) {
                          labelW = Math.max(labelW, tr.getWidth(r[0]));
                          valueW = Math.max(valueW, tr.getWidth(r[1]));
                      }
                      w = PAD * 2 + labelW + 8 + valueW;
                      h = PAD * 2 - 1 + rows.size() * 11;
                  }

                  @Override
                  public void draw(DrawContext ctx, MinecraftClient mc, boolean pv) {
                      TextRenderer tr = mc.textRenderer;
                      Theme.panel(ctx, w, h, slot().bg);
                      int y = PAD;
                      for (String[] r : rows) {
                          Theme.text(ctx, tr, r[0], PAD, y, Theme.WHITE);
                          Theme.text(ctx, tr, r[1], PAD + labelW + 8, y, Theme.accent());
                          y += 11;
                      }
                  }
              }

              // ------------------------------------------------------------------ teclas

              static final class KeysEl extends HudElement {
                  private static final int CELL = 18;
                  private static final int GAP = 2;

                  KeysEl() {
                      super("keystrokes", "Teclas", "WASD, mouse e espaço na tela", false, 0, 2, 4, -4);
                  }

                  @Override
                  public void measure(MinecraftClient mc, boolean pv) {
                      NovaConfig cfg = NovaConfig.INSTANCE;
                      w = CELL * 3 + GAP * 2;
                      h = CELL * 2 + GAP;
                      if (cfg.keysMouse) {
                          h += GAP + CELL;
                      }
                      if (cfg.keysSpace) {
                          h += GAP + 8;
                      }
                  }

                  @Override
                  public void draw(DrawContext ctx, MinecraftClient mc, boolean pv) {
                      NovaConfig cfg = NovaConfig.INSTANCE;
                      var o = mc.options;
                      boolean live = mc.player != null && !pv;
                      key(ctx, mc, CELL + GAP, 0, CELL, CELL, "W", live && o.forwardKey.isPressed());
                      int y2 = CELL + GAP;
                      key(ctx, mc, 0, y2, CELL, CELL, "A", live && o.leftKey.isPressed());
                      key(ctx, mc, CELL + GAP, y2, CELL, CELL, "S", live && o.backKey.isPressed());
                      key(ctx, mc, (CELL + GAP) * 2, y2, CELL, CELL, "D", live && o.rightKey.isPressed());
                      int y3 = y2 + CELL + GAP;
                      if (cfg.keysMouse) {
                          int half = (w - GAP) / 2;
                          key(ctx, mc, 0, y3, half, CELL, "L " + (live ? HudRenderer.leftCps() : 0),
                                  live && o.attackKey.isPressed());
                          key(ctx, mc, half + GAP, y3, w - half - GAP, CELL, "R " + (live ? HudRenderer.rightCps() : 0),
                                  live && o.useKey.isPressed());
                          y3 += CELL + GAP;
                      }
                      if (cfg.keysSpace) {
                          key(ctx, mc, 0, y3, w, 8, "", live && o.jumpKey.isPressed());
                      }
                  }

                  private void key(DrawContext ctx, MinecraftClient mc, int x, int y, int w, int h, String label,
                                   boolean pressed) {
                      NovaConfig cfg = NovaConfig.INSTANCE;
                      int base = slot().bg ? ((cfg.bgOpacity * 255 / 100) << 24) | 0x101015 : 0x40000000;
                      ctx.fill(x, y, x + w, y + h, pressed ? Theme.accent() : base);
                      if (!label.isEmpty()) {
                          int c = pressed ? Theme.onAccent(Theme.accent()) : Theme.WHITE;
                          ctx.drawCenteredTextWithShadow(mc.textRenderer, label, x + w / 2, y + (h - 8) / 2, c);
                      }
                  }
              }

