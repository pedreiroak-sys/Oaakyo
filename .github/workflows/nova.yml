      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar do Nova Client
        uses: actions/upload-artifact@v4
        with:
          name: novaclient-jar-v1-4
          path: "build/libs/novaclient-*[0-9].jar"

      - name: Montar pacote de mods (Nova + CIT Resewn + otimizacao)
        run: |
          mkdir -p pack/mods pack/mods-sodium-opcional
          cp build/libs/novaclient-*[0-9].jar pack/mods/
          # Baixa do Modrinth (1.20.1 / Fabric): $1 = pasta, demais = slugs. Se algum falhar, o build continua.
          baixar() {
            dest="$1"; shift
            for slug in "$@"; do
              url=$(curl -fsSL -A "nova-client-build" -G "https://api.modrinth.com/v2/project/$slug/version" \
                --data-urlencode 'game_versions=["1.20.1"]' \
                --data-urlencode 'loaders=["fabric"]' \
                | jq -r '(([.[] | select(.version_type=="release")] | .[0]) // .[0] | (.files // []) | (map(select(.primary))[0] // .[0]) | .url) // empty') || url=""
              if [ -n "$url" ]; then
                curl -fsSL -A "nova-client-build" -o "$dest/$slug.jar" "$url" && echo "OK: $slug" || echo "FALHOU: $slug"
              else
                echo "NAO ENCONTRADO: $slug"
              fi
            done
          }
          # pacote seguro: roda em qualquer renderer
          baixar pack/mods fabric-api cit-resewn lithium ferrite-core modernfix entityculling dynamic-fps
          # Sodium e cia: ganho enorme de FPS, mas precisam de OpenGL 3.2+ (renderer Zink/ANGLE/Vulkan)
          baixar pack/mods-sodium-opcional sodium sodium-extra immediatelyfast indium
          cat > pack/LEIA-ME.txt <<'NOVA_EOF_MARKER'
          NOVA CLIENT - pacote de mods (Minecraft 1.20.1, Fabric)

          1) Copie o conteudo da pasta "mods" para a pasta mods do seu perfil. Funciona em qualquer renderer.
          2) Quer FPS extra? Copie tambem o conteudo de "mods-sodium-opcional" (Sodium, Sodium Extra,
             ImmediatelyFast e Indium). Eles exigem OpenGL 3.2 ou mais: use o renderer Zink/Vulkan ou ANGLE
             do Mojo Launcher. Se o jogo travar ao abrir, apague esses 4 arquivos e use o renderer padrao.
          3) Dentro do jogo: tecla Shift direito (ou botao "Nova" no menu) abre o menu; J abre o editor de HUD.
          NOVA_EOF_MARKER
          find pack -type f | sort
          cd pack && zip -r ../nova-mods-1.20.1.zip mods mods-sodium-opcional LEIA-ME.txt

      - name: Criar resource pack de exemplo (CIT Resewn)
        run: |
          d='pack/Nova-CIT/assets/minecraft/citresewn/cit/nova_sword'
          mkdir -p "$d"
          cat > pack/Nova-CIT/pack.mcmeta <<'NOVA_EOF_MARKER'
          {
            "pack": {
              "pack_format": 15,
              "description": "Nova CIT - exemplo (renomeie uma espada de diamante para nova)"
            }
          }
          NOVA_EOF_MARKER
          cat > "$d/nova_sword.properties" <<'NOVA_EOF_MARKER'
          type=item
          items=minecraft:diamond_sword
          texture=nova_sword.png
          nbt.display.Name=ipattern:*nova*
          NOVA_EOF_MARKER
          echo 'iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAATklEQVR4nGNgGHngoaze//////8f1TysNLMgcypE5P4zMDAwyD26yMDIyMhIjAFM6JoZGBiI1oxiAAx0vHlEtGY4qBCR+4/sArIMIFcvAKSpPb6TVxF2AAAAAElFTkSuQmCC' | base64 -d > "$d/nova_sword.png"
          cd pack && zip -r ../Nova-CIT.zip Nova-CIT

      - name: Upload pacote de mods
        uses: actions/upload-artifact@v4
        with:
          name: nova-mods-1-20-1
          path: nova-mods-1.20.1.zip

      - name: Upload resource pack CIT
        uses: actions/upload-artifact@v4
        with:
          name: nova-cit-pack
          path: Nova-CIT.zip

      - name: Desativar workflow antigo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow disable build.yml || true
