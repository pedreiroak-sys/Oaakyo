              private Mods() {
              }

              public static List<Mod> of(Cat cat) {
                  List<Mod> list = new ArrayList<>();
                  for (Mod m : ALL) {
                      if (m.cat == cat) {
                          list.add(m);
                      }
                  }
                  return list;
              }

              // ------------------------------------------------------------------ construtores

              /** Módulo ligado a um elemento do HUD (já inclui tamanho, fundo e mover). */
              private static Mod el(Cat cat, String id, Opt... extra) {
                  HudElement e = HudElements.byId(id);
                  Mod m = new Mod(e.title, e.desc, cat);
                  m.get = () -> e.slot().on;
                  m.set = v -> e.slot().on = v;
                  for (Opt o : extra) {
                      m.opts.add(o);
                  }
                  m.opts.add(Opt.cycle("Posição rápida", POSITIONS,
                          () -> e.slot().ay * 3 + e.slot().ax, v -> setAnchor(e.slot(), v)));
                  m.opts.add(Opt.slider("Tamanho", 50, 300, 10, "%", () -> e.slot().scale, v -> e.slot().scale = v));
                  m.opts.add(Opt.toggle("Fundo", () -> e.slot().bg, v -> e.slot().bg = v));
                  m.opts.add(Opt.action("Arrastar na tela", () -> HudEditorScreen.open(e.hidden() ? null : e)));
                  m.opts.add(Opt.action("Resetar posição", () -> NovaConfig.INSTANCE.resetSlot(e)));
                  ALL.add(m);
                  return m;
              }

              private static Mod mod(Cat cat, String name, String desc, BooleanSupplier get, Consumer<Boolean> set,
                                     Opt... opts) {
                  Mod m = new Mod(name, desc, cat);
                  m.get = get;
                  m.set = set;
                  for (Opt o : opts) {
                      m.opts.add(o);
                  }
                  ALL.add(m);
                  return m;
              }

              private static Mod panel(Cat cat, String name, String desc, Opt... opts) {
                  return mod(cat, name, desc, null, null, opts);
              }

              private static Mod button(Cat cat, String name, String desc, Runnable run) {
                  Mod m = new Mod(name, desc, cat);
                  m.action = run;
                  ALL.add(m);
                  return m;
              }

