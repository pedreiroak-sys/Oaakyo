              private static MinecraftClient mc() {
                  return MinecraftClient.getInstance();
              }

              private static void setProfile(NovaConfig c, int value) {
                  c.perfProfile = Math.floorMod(value, 3);
                  Performance.apply(mc(), c.perfProfile);
              }

              private static void stepFps(int dir) {
                  MinecraftClient mc = mc();
                  int v = mc.options.getMaxFps().getValue();
                  int idx = FPS_STEPS.length - 1;
                  for (int i = 0; i < FPS_STEPS.length; i++) {
                      if (v <= FPS_STEPS[i]) {
                          idx = i;
                          break;
                      }
                  }
                  idx = Math.max(0, Math.min(FPS_STEPS.length - 1, idx + dir));
                  mc.options.getMaxFps().setValue(FPS_STEPS[idx]);
                  mc.options.write();
              }

              /** Posição rápida: escolhe um dos 9 cantos/centros da tela com uma pequena margem. */
              private static void setAnchor(NovaConfig.Slot s, int v) {
                  v = Math.floorMod(v, 9);
                  s.ax = v % 3;
                  s.ay = v / 3;
                  s.dx = s.ax == 0 ? 4 : (s.ax == 2 ? -4 : 0);
                  s.dy = s.ay == 0 ? 4 : (s.ay == 2 ? -4 : 0);
              }

              private static void message(String text) {
                  MinecraftClient mc = mc();
                  if (mc.player != null) {
                      mc.player.sendMessage(net.minecraft.text.Text.literal(text), true);
                  }
              }

