          package com.novaclient;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.sound.PositionedSoundInstance;
          import net.minecraft.item.ItemStack;
          import net.minecraft.sound.SoundEvents;
          import net.minecraft.text.Text;

          import java.util.ArrayList;
          import java.util.List;

          /**
           * Menu do Nova Client: categorias com ícone na lateral, módulos em cartões (ligar/desligar + engrenagem)
           * e uma página de opções por módulo. Feito para toque: arrastar rola a lista, sliders arrastáveis.
           */
          public class NovaMenuScreen extends Screen {
              private static final int HEAD = 32;
              private static final int M = 6;
              private static final int GAP = 6;
              private static final int TITLE_H = 20;
              private static final int SET_H = 26;
              private static final int BTN_H = 18;
              private static final int CLOSE_W = 22;

              private static int lastCat = 0;

              private final Screen parent;
              private final List<Entry> items = new ArrayList<>();

              private final Mods.Cat[] cats = Mods.Cat.values();
              private int cat;
              private Mods.Mod open;

              private int px, py, pw, ph;
              private int sideX, sideY, sideW, sideH;
              private int contX, contY, contW, contH;
              private int listY, listH;
              private int editX, editY, editW;
              private int closeX, closeY;
              private int backX, backY, backW;
              private boolean iconOnly;

              private float scroll;
              private float maxScroll;
              private float totalH;

              private Entry pressed;
              private Entry active;
              private boolean pressInList;
              private boolean moved;
              private double pressX;
              private double pressY;

              public NovaMenuScreen(Screen parent) {
                  super(Text.literal("Nova Client"));
                  this.parent = parent;
              }

              // ------------------------------------------------------------------ montagem

              @Override
              protected void init() {
                  cat = Math.max(0, Math.min(cats.length - 1, lastCat));
                  open = null;
                  scroll = 0;
                  layout();
                  rebuild();
              }

              private void layout() {
                  pw = Math.min(width - 8, 500);
                  ph = Math.min(height - 8, 300);
                  px = (width - pw) / 2;
                  py = (height - ph) / 2;

                  iconOnly = pw < 300;
                  sideW = iconOnly ? 30 : (pw < 380 ? 80 : 94);
                  sideX = px + M;
                  sideY = py + HEAD + M;
                  sideH = py + ph - M - sideY;

                  contX = sideX + sideW + M;
                  contY = sideY;
                  contW = px + pw - M - contX;
                  contH = sideH;

                  closeX = px + pw - M - CLOSE_W;
                  closeY = py + (HEAD - BTN_H) / 2;
                  editW = pw < 330 ? 60 : 78;
                  editX = closeX - 5 - editW;
                  editY = closeY;
              }

              private int tabH() {
                  return Math.min(28, (sideH - 8) / cats.length);
              }

              private void rebuild() {
                  items.clear();
                  boolean settings = open != null;
                  int top = settings ? SET_H + 4 : TITLE_H + 2;
                  listY = contY + top;
                  listH = contH - top;
                  backX = contX;
                  backY = contY;
                  backW = contW;

                  int innerW = contW - 6; // espaço para a barra de rolagem
                  int y = 0;
                  if (!settings) {
                      int cols = innerW >= 300 ? 3 : 2;
                      int cardW = (innerW - GAP * (cols - 1)) / cols;
                      int cardH = 60;
                      List<Mods.Mod> mods = Mods.of(cats[cat]);
                      for (int i = 0; i < mods.size(); i++) {
                          Card c = new Card(mods.get(i));
                          c.x = (i % cols) * (cardW + GAP);
                          c.y = (i / cols) * (cardH + GAP);
                          c.w = cardW;
                          c.h = cardH;
                          items.add(c);
                      }
                      int rows = (mods.size() + cols - 1) / cols;
                      totalH = rows == 0 ? 0 : rows * cardH + (rows - 1) * GAP;
                  } else {
                      for (Mods.Opt o : open.opts) {
                          OptRow r = new OptRow(o);
                          r.x = 0;
                          r.y = y;
                          r.w = innerW;
                          r.h = o.kind == Mods.Opt.Kind.ACTION ? 22 : 24;
                          items.add(r);
                          y += r.h + 4;
                      }
                      totalH = Math.max(0, y - 4);
                  }
                  maxScroll = Math.max(0, totalH - listH);
                  scroll = Math.max(0, Math.min(maxScroll, scroll));
              }

              private void openMod(Mods.Mod m) {
                  open = m;
                  scroll = 0;
                  rebuild();
              }

              private void closeMod() {
                  open = null;
                  scroll = 0;
                  rebuild();
              }

              // ------------------------------------------------------------------ desenho

              /** Desenha um item do jogo (ícone) em (x, y) com a escala dada. */
              private void icon(DrawContext ctx, ItemStack st, float x, float y, float sc) {
                  if (st == null || st.isEmpty()) {
                      return;
                  }
                  ctx.getMatrices().push();
                  ctx.getMatrices().translate(x, y, 0);
                  ctx.getMatrices().scale(sc, sc, 1f);
                  ctx.drawItem(st, 0, 0);
                  ctx.getMatrices().pop();
              }

              @Override
              public void render(DrawContext ctx, int mouseX, int mouseY, float delta) {
                  int accent = Theme.accent();
                  int onAccent = Theme.onAccent(accent);

                  ctx.fill(0, 0, width, height, Theme.DIM);
                  Theme.rounded(ctx, px - 1, py - 1, px + pw + 1, py + ph + 1, Theme.withAlpha(accent, 0x90));
                  Theme.rounded(ctx, px, py, px + pw, py + ph, Theme.PANEL);

                  // cabeçalho com brilho da cor de destaque
                  ctx.fillGradient(px + 2, py + 1, px + pw - 2, py + HEAD, Theme.withAlpha(accent, 0x3A),
                          Theme.withAlpha(accent, 0x00));
                  ctx.fill(px + 2, py + HEAD, px + pw - 2, py + HEAD + 1, Theme.BORDER);

                  // logo
                  int ly = py + (HEAD - 20) / 2;
                  Theme.rounded(ctx, px + M, ly, px + M + 20, ly + 20, accent);
                  Theme.scaled(ctx, textRenderer, "N", px + M + 10, ly + 10, 1.3f, onAccent, true, Theme.CENTER);
                  int tx = px + M + 27;
                  Theme.scaled(ctx, textRenderer, "NOVA", tx, py + HEAD / 2f - 3, 1.2f, Theme.WHITE, true, Theme.LEFT);
                  int nw = Theme.scaledWidth(textRenderer, "NOVA", 1.2f, true);
                  Theme.scaled(ctx, textRenderer, "CLIENT", tx + nw + 4, py + HEAD / 2f - 3, 0.9f, accent, true, Theme.LEFT);
                  if (pw >= 340) {
                      Theme.scaled(ctx, textRenderer, "v1.4  ·  Minecraft 1.20.1", tx, py + HEAD / 2f + 8, 0.6f, Theme.MUTED,
                              false, Theme.LEFT);
                  }

                  // botões do cabeçalho
                  boolean he = inside(mouseX, mouseY, editX, editY, editW, BTN_H);
                  Theme.rounded(ctx, editX, editY, editX + editW, editY + BTN_H,
                          he ? Theme.mix(accent, Theme.WHITE, 0.2f) : accent);
                  Theme.scaled(ctx, textRenderer, "EDITAR HUD", editX + editW / 2f, editY + BTN_H / 2f, 0.72f, onAccent, true,
                          Theme.CENTER);
                  boolean hc = inside(mouseX, mouseY, closeX, closeY, CLOSE_W, BTN_H);
                  Theme.rounded(ctx, closeX, closeY, closeX + CLOSE_W, closeY + BTN_H, hc ? Theme.WARN : Theme.CARD_HOVER);
                  Theme.scaled(ctx, textRenderer, "X", closeX + CLOSE_W / 2f, closeY + BTN_H / 2f, 0.9f, Theme.WHITE, true,
                          Theme.CENTER);

                  drawSidebar(ctx, mouseX, mouseY, accent);

                  // conteúdo
                  if (open != null) {
                      drawSettingsHeader(ctx, mouseX, mouseY, accent);
                  } else {
                      Theme.scaled(ctx, textRenderer, cats[cat].label, contX + 2, contY + 9, 1.1f, Theme.WHITE, true,
                              Theme.LEFT);
                      int tw = Theme.scaledWidth(textRenderer, cats[cat].label, 1.1f, true);
                      Theme.scaled(ctx, textRenderer, Mods.of(cats[cat]).size() + " módulos", contX + 8 + tw, contY + 10, 0.65f,
                              Theme.MUTED, false, Theme.LEFT);
                      if (contW >= 260) {
                          Theme.scaled(ctx, textRenderer, "toque = ligar   ···  = opções", contX + contW - 6, contY + 10, 0.6f,
                                  Theme.MUTED, false, Theme.RIGHT);
                      }
                  }
                  ctx.enableScissor(contX, listY, contX + contW, listY + listH);
                  for (Entry it : items) {
                      int dy = listY + it.y - Math.round(scroll);
                      if (dy + it.h < listY || dy > listY + listH) {
                          continue;
                      }
                      boolean hv = inside(mouseX, mouseY, contX + it.x, dy, it.w, it.h)
                              && inside(mouseX, mouseY, contX, listY, contW, listH);
                      it.draw(ctx, contX + it.x, dy, hv, mouseX, mouseY, accent, onAccent);
                  }
                  ctx.disableScissor();

                  // barra de rolagem
                  if (maxScroll > 0) {
                      int trackX = contX + contW - 3;
                      int thumbH = Math.max(14, Math.round(listH * (listH / totalH)));
                      int thumbY = listY + Math.round((listH - thumbH) * (scroll / maxScroll));
                      ctx.fill(trackX, listY, trackX + 2, listY + listH, 0xFF1C1C24);
                      ctx.fill(trackX, thumbY, trackX + 2, thumbY + thumbH, accent);
                  }
                  if (items.isEmpty()) {
                      Theme.scaled(ctx, textRenderer, "Nada aqui ainda", contX + contW / 2f, listY + 20, 0.9f, Theme.MUTED,
                              false, Theme.CENTER);
                  }

                  super.render(ctx, mouseX, mouseY, delta);
              }

              private void drawSidebar(DrawContext ctx, int mouseX, int mouseY, int accent) {
                  Theme.rounded(ctx, sideX, sideY, sideX + sideW, sideY + sideH, Theme.SIDEBAR);
                  int tabH = tabH();
                  for (int i = 0; i < cats.length; i++) {
                      int ty = sideY + 4 + i * tabH;
                      int th = tabH - 2;
                      boolean on = i == cat;
                      boolean hv = inside(mouseX, mouseY, sideX + 3, ty, sideW - 6, th);
                      if (on) {
                          Theme.rounded(ctx, sideX + 3, ty, sideX + sideW - 3, ty + th, Theme.withAlpha(accent, 0x38));
                          ctx.fill(sideX + 3, ty + 3, sideX + 5, ty + th - 3, accent);
                      } else if (hv) {
                          Theme.rounded(ctx, sideX + 3, ty, sideX + sideW - 3, ty + th, Theme.CARD);
                      }
                      float sc = th >= 20 ? 0.85f : 0.7f;
                      float isz = 16 * sc;
                      if (iconOnly) {
                          icon(ctx, cats[i].icon, sideX + (sideW - isz) / 2f, ty + (th - isz) / 2f, sc);
                      } else {
                          icon(ctx, cats[i].icon, sideX + 9, ty + (th - isz) / 2f, sc);
                          Theme.scaled(ctx, textRenderer, cats[i].label, sideX + 12 + isz, ty + th / 2f, 0.82f,
                                  on ? Theme.WHITE : Theme.GRAY, on, Theme.LEFT);
                      }
                  }
              }

              private void drawSettingsHeader(DrawContext ctx, int mx, int my, int accent) {
                  boolean hb = inside(mx, my, backX, backY, 54, 20);
                  Theme.rounded(ctx, backX, backY, backX + 54, backY + 20, hb ? Theme.CARD_HOVER : Theme.CARD);
                  Theme.scaled(ctx, textRenderer, "< Voltar", backX + 27, backY + 10, 0.8f, Theme.WHITE, true, Theme.CENTER);
                  Theme.rounded(ctx, backX + 60, backY, backX + 82, backY + 22, Theme.withAlpha(accent, 0x45));
                  icon(ctx, open.icon, backX + 63, backY + 3, 1f);
                  int nx = backX + 88;
                  int maxW = backW - 88 - 44;
                  Theme.scaled(ctx, textRenderer, Theme.fit(textRenderer, open.name, 1.0f, maxW), nx, backY + 7, 1.0f,
                          Theme.WHITE, true, Theme.LEFT);
                  Theme.scaled(ctx, textRenderer, Theme.fit(textRenderer, open.desc, 0.6f, maxW), nx, backY + 18, 0.6f,
                          Theme.MUTED, false, Theme.LEFT);
                  if (open.hasToggle()) {
                      drawSwitch(ctx, backX + backW - 34, backY + 5, open.enabled(), accent);
                  }
              }

              private static void drawSwitch(DrawContext ctx, int x, int y, boolean on, int accent) {
                  int w = 28;
                  int h = 12;
                  Theme.rounded(ctx, x, y, x + w, y + h, on ? accent : Theme.OFF_TRACK);
                  int kx = on ? x + w - h + 1 : x + 1;
                  Theme.rounded(ctx, kx, y + 1, kx + h - 2, y + h - 1, Theme.WHITE);
              }

              private static boolean inside(double mx, double my, int x, int y, int w, int h) {
                  return mx >= x && mx < x + w && my >= y && my < y + h;
              }

              private void click() {
                  if (client != null) {
                      client.getSoundManager().play(PositionedSoundInstance.master(SoundEvents.UI_BUTTON_CLICK, 1.0f));
                  }
              }

              // ------------------------------------------------------------------ entrada

              @Override
              public boolean mouseClicked(double mx, double my, int button) {
                  if (button != 0) {
                      return super.mouseClicked(mx, my, button);
                  }
                  pressed = null;
                  active = null;
                  moved = false;
                  pressInList = false;

                  if (inside(mx, my, editX, editY, editW, BTN_H)) {
                      click();
                      HudEditorScreen.open(null);
                      return true;
                  }
                  if (inside(mx, my, closeX, closeY, CLOSE_W, BTN_H)) {
                      click();
                      close();
                      return true;
                  }
                  int tabH = tabH();
                  for (int i = 0; i < cats.length; i++) {
                      if (inside(mx, my, sideX + 3, sideY + 4 + i * tabH, sideW - 6, tabH - 2)) {
                          if (i != cat || open != null) {
                              NovaConfig.save();
                              cat = i;
                              lastCat = i;
                              open = null;
                              scroll = 0;
                              rebuild();
                          }
                          click();
                          return true;
                      }
                  }
                  if (open != null) {
                      if (inside(mx, my, backX, backY, 54, 20)) {
                          click();
                          closeMod();
                          return true;
                      }
                      if (open.hasToggle() && inside(mx, my, backX + backW - 40, backY, 40, 24)) {
                          click();
                          open.toggle();
                          return true;
                      }
                  }
                  if (inside(mx, my, contX, listY, contW, listH)) {
                      pressInList = true;
                      pressX = mx;
                      pressY = my;
                      pressed = hit(mx, my);
                      if (pressed != null && pressed.draggable()) {
                          active = pressed;
                          active.drag(mx, contX + pressed.x);
                      }
                      return true;
                  }
                  return super.mouseClicked(mx, my, button);
              }

              private Entry hit(double mx, double my) {
                  double ly = my - listY + scroll;
                  double lx = mx - contX;
                  for (Entry it : items) {
                      if (lx >= it.x && lx < it.x + it.w && ly >= it.y && ly < it.y + it.h) {
                          return it;
                      }
                  }
                  return null;
              }

              @Override
              public boolean mouseDragged(double mx, double my, int button, double dx, double dy) {
                  if (active != null) {
                      active.drag(mx, contX + active.x);
                      return true;
                  }
                  if (pressInList) {
                      if (!moved && Math.hypot(mx - pressX, my - pressY) > 4) {
                          moved = true;
                      }
                      if (moved) {
                          scroll = Math.max(0, Math.min(maxScroll, scroll - (float) dy));
                      }
                      return true;
                  }
                  return super.mouseDragged(mx, my, button, dx, dy);
              }

              @Override
              public boolean mouseReleased(double mx, double my, int button) {
                  if (button == 0) {
                      boolean handled = pressInList || active != null;
                      if (active != null) {
                          NovaConfig.save();
                      } else if (pressed != null && !moved) {
                          pressed.press(mx, contX + pressed.x);
                          click();
                      }
                      pressed = null;
                      active = null;
                      pressInList = false;
                      moved = false;
                      if (handled) {
                          return true;
                      }
                  }
                  return super.mouseReleased(mx, my, button);
              }

              @Override
              public boolean mouseScrolled(double mx, double my, double amount) {
                  if (inside(mx, my, contX, listY, contW, listH)) {
                      scroll = Math.max(0, Math.min(maxScroll, scroll - (float) amount * 14f));
                      return true;
                  }
                  return super.mouseScrolled(mx, my, amount);
              }

              @Override
              public void removed() {
                  NovaConfig.save();
              }

              @Override
              public void close() {
                  if (client != null) {
                      client.setScreen(parent);
                  }
              }

              // ------------------------------------------------------------------ itens da lista

              private abstract class Entry {
                  int x;
                  int y;
                  int w;
                  int h;

                  abstract void draw(DrawContext ctx, int sx, int sy, boolean hover, int mouseX, int mouseY, int accent,
                                     int onAccent);

                  /** Toque (soltou sem arrastar). mx = x do mouse; ix = x deste item na tela. */
                  abstract void press(double mx, int ix);

                  boolean draggable() {
                      return false;
                  }

                  void drag(double mx, int ix) {
                  }
              }

              private final class Card extends Entry {
                  final Mods.Mod mod;

                  Card(Mods.Mod mod) {
                      this.mod = mod;
                  }

                  @Override
                  void draw(DrawContext ctx, int sx, int sy, boolean hover, int mouseX, int mouseY, int accent, int onAccent) {
                      boolean on = mod.enabled();
                      Theme.rounded(ctx, sx, sy, sx + w, sy + h, on ? Theme.withAlpha(accent, 0xC0) : Theme.BORDER);
                      int fill = hover ? Theme.CARD_HOVER : Theme.CARD;
                      if (on) {
                          fill = Theme.mix(fill, accent, 0.10f);
                      }
                      Theme.rounded(ctx, sx + 1, sy + 1, sx + w - 1, sy + h - 1, fill);

                      // ícone do módulo
                      Theme.rounded(ctx, sx + 6, sy + 6, sx + 30, sy + 30,
                              on ? Theme.withAlpha(accent, 0x55) : Theme.SIDEBAR);
                      icon(ctx, mod.icon, sx + 10, sy + 10, 1f);

                      int tx = sx + 36;
                      int tw = w - 36 - 6;
                      Theme.scaled(ctx, textRenderer, Theme.fit(textRenderer, mod.name, 0.92f, tw), tx, sy + 12, 0.92f,
                              Theme.WHITE, true, Theme.LEFT);
                      List<String> lines = Theme.wrap(textRenderer, mod.desc, 0.62f, tw, 2);
                      for (int i = 0; i < lines.size(); i++) {
                          Theme.scaled(ctx, textRenderer, lines.get(i), tx, sy + 23 + i * 8, 0.62f, Theme.MUTED, false,
                                  Theme.LEFT);
                      }

                      int by = sy + h - 18;
                      if (mod.action != null) {
                          Theme.scaled(ctx, textRenderer, "ABRIR  >", sx + 8, by + 7, 0.75f, accent, true, Theme.LEFT);
                          return;
                      }
                      if (mod.hasToggle()) {
                          drawSwitch(ctx, sx + 8, by + 1, on, accent);
                      } else {
                          Theme.scaled(ctx, textRenderer, "CONFIGURAR  >", sx + 8, by + 7, 0.72f, accent, true, Theme.LEFT);
                      }
                      if (!mod.opts.isEmpty() && mod.hasToggle()) {
                          int gx = sx + w - 30;
                          boolean hg = inside(mouseX, mouseY, gx, by, 24, 14) && hover;
                          Theme.rounded(ctx, gx, by, gx + 24, by + 14, hg ? Theme.OFF_TRACK : Theme.SIDEBAR);
                          for (int i = 0; i < 3; i++) {
                              ctx.fill(gx + 6 + i * 5, by + 6, gx + 8 + i * 5, by + 8, Theme.WHITE);
                          }
                      }
                  }

                  @Override
                  void press(double mx, int ix) {
                      if (mod.action != null) {
                          mod.action.run();
                          NovaConfig.save();
                          rebuild();
                          return;
                      }
                      boolean gear = !mod.opts.isEmpty() && mod.hasToggle() && mx >= ix + w - 34;
                      if (gear || (!mod.hasToggle() && !mod.opts.isEmpty())) {
                          openMod(mod);
                      } else if (mod.hasToggle()) {
                          mod.toggle();
                      }
                  }
              }

              private final class OptRow extends Entry {
                  final Mods.Opt opt;
                  private static final int STEP_W = 20;

                  OptRow(Mods.Opt opt) {
                      this.opt = opt;
                  }

                  private int ctrlW() {
                      return Math.min(130, w / 2);
                  }

                  @Override
                  void draw(DrawContext ctx, int sx, int sy, boolean hover, int mouseX, int mouseY, int accent, int onAccent) {
                      if (opt.kind == Mods.Opt.Kind.ACTION) {
                          Theme.rounded(ctx, sx, sy, sx + w, sy + h, hover ? accent : Theme.BORDER);
                          Theme.rounded(ctx, sx + 1, sy + 1, sx + w - 1, sy + h - 1,
                                  hover ? Theme.mix(accent, 0xFF000000, 0.45f) : Theme.CARD);
                          Theme.scaled(ctx, textRenderer, opt.label, sx + w / 2f, sy + h / 2f, 0.9f, Theme.WHITE, true,
                                  Theme.CENTER);
                          return;
                      }
                      Theme.rounded(ctx, sx, sy, sx + w, sy + h, Theme.BORDER);
                      Theme.rounded(ctx, sx + 1, sy + 1, sx + w - 1, sy + h - 1, hover ? Theme.CARD_HOVER : Theme.CARD);
                      int cw = ctrlW();
                      Theme.scaled(ctx, textRenderer, Theme.fit(textRenderer, opt.label, 0.9f, w - cw - 18), sx + 8,
                              sy + h / 2f, 0.9f, Theme.WHITE, false, Theme.LEFT);
                      int cx = sx + w - cw - 6;
                      switch (opt.kind) {
                          case TOGGLE -> drawSwitch(ctx, sx + w - 38, sy + (h - 12) / 2, opt.get.getAsBoolean(), accent);
                          case STEP -> {
                              int by = sy + (h - 16) / 2;
                              Theme.rounded(ctx, cx, by, cx + STEP_W, by + 16, accent);
                              Theme.rounded(ctx, cx + cw - STEP_W, by, cx + cw, by + 16, accent);
                              Theme.scaled(ctx, textRenderer, "-", cx + STEP_W / 2f, by + 8, 1.3f, onAccent, true, Theme.CENTER);
                              Theme.scaled(ctx, textRenderer, "+", cx + cw - STEP_W / 2f, by + 8, 1.3f, onAccent, true,
                                      Theme.CENTER);
                              Theme.scaled(ctx, textRenderer,
                                      Theme.fit(textRenderer, opt.text.get(), 0.85f, cw - STEP_W * 2 - 4),
                                      cx + cw / 2f, by + 8, 0.85f, Theme.WHITE, true, Theme.CENTER);
                          }
                          case SLIDER -> {
                              int tx0 = trackX0();
                              int tx1 = trackX1();
                              int ty = sy + h / 2;
                              Theme.rounded(ctx, tx0, ty - 2, tx1, ty + 2, Theme.OFF_TRACK);
                              float t = (opt.iget.getAsInt() - opt.min) / (float) (opt.max - opt.min);
                              t = Math.max(0f, Math.min(1f, t));
                              int kx = tx0 + Math.round((tx1 - tx0) * t);
                              if (kx - tx0 > 4) {
                                  Theme.rounded(ctx, tx0, ty - 2, kx, ty + 2, accent);
                              }
                              Theme.rounded(ctx, kx - 4, ty - 6, kx + 4, ty + 6, Theme.WHITE);
                              Theme.scaled(ctx, textRenderer, opt.iget.getAsInt() + opt.unit, sx + w - 6, sy + h / 2f, 0.75f,
                                      Theme.GRAY, false, Theme.RIGHT);
                          }
                          default -> {
                          }
                      }
                  }

                  // posição da trilha do slider em coordenadas da tela (usa x do item na tela)
                  private int trackX0() {
                      return contX + x + w - ctrlW() - 6;
                  }

                  private int trackX1() {
                      return contX + x + w - 44;
                  }

                  @Override
                  boolean draggable() {
                      return opt.kind == Mods.Opt.Kind.SLIDER;
                  }

                  @Override
                  void drag(double mx, int ix) {
                      if (opt.kind != Mods.Opt.Kind.SLIDER) {
                          return;
                      }
                      int tx0 = trackX0();
                      int tx1 = trackX1();
                      double t = (mx - tx0) / (double) Math.max(1, tx1 - tx0);
                      t = Math.max(0, Math.min(1, t));
                      double raw = opt.min + t * (opt.max - opt.min);
                      int v = opt.min + (int) Math.round((raw - opt.min) / opt.step) * opt.step;
                      v = Math.max(opt.min, Math.min(opt.max, v));
                      if (v != opt.iget.getAsInt()) {
                          opt.iset.accept(v);
                      }
                  }

                  @Override
                  void press(double mx, int ix) {
                      switch (opt.kind) {
                          case TOGGLE -> opt.set.accept(!opt.get.getAsBoolean());
                          case STEP -> {
                              int cw = ctrlW();
                              int cx = ix + w - cw - 6;
                              if (mx < cx + cw / 2.0) {
                                  opt.dec.run();
                              } else {
                                  opt.inc.run();
                              }
                          }
                          case ACTION -> {
                              opt.run.run();
                              rebuild();
                          }
                          default -> {
                          }
                      }
                  }
              }
          }
