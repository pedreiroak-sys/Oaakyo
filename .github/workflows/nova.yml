              // ------------------------------------------------------------------ utilidades

              private static String ping(MinecraftClient mc) {
                  if (mc.isInSingleplayer()) {
                      return "-";
                  }
                  var handler = mc.getNetworkHandler();
                  if (handler == null || mc.player == null) {
                      return "-";
                  }
                  var entry = handler.getPlayerListEntry(mc.player.getUuid());
                  return entry == null ? "-" : entry.getLatency() + " ms";
              }

              private static String direction(Direction d) {
                  return switch (d) {
                      case NORTH -> "Norte (-Z)";
                      case SOUTH -> "Sul (+Z)";
                      case EAST -> "Leste (+X)";
                      case WEST -> "Oeste (-X)";
                      default -> d.asString();
                  };
              }

              private static int count(MinecraftClient mc, Item item) {
                  if (mc.player == null) {
                      return 0;
                  }
                  PlayerInventory inv = mc.player.getInventory();
                  int n = 0;
                  for (ItemStack s : inv.main) {
                      if (s.isOf(item)) {
                          n += s.getCount();
                      }
                  }
                  for (ItemStack s : inv.offHand) {
                      if (s.isOf(item)) {
                          n += s.getCount();
                      }
                  }
                  return n;
              }

              private static int healingPots(MinecraftClient mc) {
                  if (mc.player == null) {
                      return 0;
                  }
                  PlayerInventory inv = mc.player.getInventory();
                  int n = 0;
                  for (ItemStack s : inv.main) {
                      n += healingCount(s);
                  }
                  for (ItemStack s : inv.offHand) {
                      n += healingCount(s);
                  }
                  return n;
              }

              private static int healingCount(ItemStack s) {
                  if (!s.isOf(Items.SPLASH_POTION)) {
                      return 0;
                  }
                  Potion p = PotionUtil.getPotion(s);
                  return (p == Potions.HEALING || p == Potions.STRONG_HEALING) ? s.getCount() : 0;
              }

