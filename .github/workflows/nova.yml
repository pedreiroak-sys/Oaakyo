              static final class TargetEl extends HudElement {
                  private String name = "";
                  private String hp = "";
                  private float frac = 1f;

                  TargetEl() {
                      super("target", "Target HUD", "Vida do inimigo que você está mirando/batendo", false, 1, 0, 0, 4);
                  }

                  @Override
                  public void measure(MinecraftClient mc, boolean pv) {
                      LivingEntity t = mc.player == null ? null : Combat.target(mc);
                      if (t != null) {
                          name = t.getName().getString();
                          float cur = t.getHealth();
                          float max = Math.max(1f, t.getMaxHealth());
                          hp = String.format(Locale.ROOT, "%.1f/%.0f", cur, max);
                          frac = Math.max(0f, Math.min(1f, cur / max));
                      } else if (pv) {
                          name = "Jogador";
                          hp = "14.0/20";
                          frac = 0.7f;
                      } else {
                          w = 0;
                          h = 0;
                          return;
                      }
                      TextRenderer tr = mc.textRenderer;
                      w = Math.max(100, PAD * 2 + tr.getWidth(name) + 10 + tr.getWidth(hp));
                      h = 25;
                  }

                  @Override
                  public void draw(DrawContext ctx, MinecraftClient mc, boolean pv) {
                      TextRenderer tr = mc.textRenderer;
                      Theme.panel(ctx, w, h, slot().bg);
                      Theme.text(ctx, tr, name, PAD, 4, Theme.WHITE);
                      Theme.text(ctx, tr, hp, w - PAD - tr.getWidth(hp), 4, Theme.GRAY);
                      int bx = PAD;
                      int bw = w - PAD * 2;
                      int by = 15;
                      ctx.fill(bx, by, bx + bw, by + 5, 0xFF2A2A33);
                      int col = frac > 0.6f ? Theme.GREEN : (frac > 0.3f ? Theme.YELLOW : Theme.WARN);
                      ctx.fill(bx, by, bx + Math.round(bw * frac), by + 5, col);
                  }
              }

              // ------------------------------------------------------------------ contador de itens

              static final class ItemsEl extends HudElement {
                  private final List<ItemStack> icons = new ArrayList<>();
                  private final List<Integer> counts = new ArrayList<>();

                  ItemsEl() {
                      super("items", "Contador de itens", "Pots, maçãs, totens, pérolas e mais", false, 2, 2, -4, -4);
                  }

                  private static ItemStack potIcon() {
                      return PotionUtil.setPotion(new ItemStack(Items.SPLASH_POTION), Potions.STRONG_HEALING);
                  }

                  private void add(ItemStack icon, int n) {
                      icons.add(icon);
                      counts.add(n);
                  }

                  @Override
                  public void measure(MinecraftClient mc, boolean pv) {
                      icons.clear();
                      counts.clear();
                      NovaConfig cfg = NovaConfig.INSTANCE;
                      boolean fake = mc.player == null;
                      if (cfg.cntPots) {
                          add(potIcon(), fake ? 24 : healingPots(mc));
                      }
                      if (cfg.cntGap) {
                          add(new ItemStack(Items.GOLDEN_APPLE), fake ? 8
                                  : count(mc, Items.GOLDEN_APPLE) + count(mc, Items.ENCHANTED_GOLDEN_APPLE));
                      }
                      if (cfg.cntTotem) {
                          add(new ItemStack(Items.TOTEM_OF_UNDYING), fake ? 3 : count(mc, Items.TOTEM_OF_UNDYING));
                      }
                      if (cfg.cntPearl) {
                          add(new ItemStack(Items.ENDER_PEARL), fake ? 16 : count(mc, Items.ENDER_PEARL));
                      }
                      if (cfg.cntArrows) {
                          add(new ItemStack(Items.ARROW), fake ? 64 : count(mc, Items.ARROW));
                      }
                      if (cfg.cntCrystal) {
                          add(new ItemStack(Items.END_CRYSTAL), fake ? 12 : count(mc, Items.END_CRYSTAL));
                      }
                      if (icons.isEmpty()) {
                          if (pv) {
                              add(potIcon(), 24);
                              add(new ItemStack(Items.GOLDEN_APPLE), 8);
                          } else {
                              w = 0;
                              h = 0;
                              return;
                          }
                      }
                      TextRenderer tr = mc.textRenderer;
                      int m = 0;
                      for (int n : counts) {
                          m = Math.max(m, tr.getWidth("x" + n));
                      }
                      w = PAD * 2 + 18 + m;
                      h = PAD * 2 - 2 + icons.size() * 17;
                  }

                  @Override
                  public void draw(DrawContext ctx, MinecraftClient mc, boolean pv) {
                      TextRenderer tr = mc.textRenderer;
                      Theme.panel(ctx, w, h, slot().bg);
                      int y = PAD - 1;
                      for (int i = 0; i < icons.size(); i++) {
                          int n = counts.get(i);
                          ctx.drawItem(icons.get(i), PAD, y);
                          Theme.text(ctx, tr, "x" + n, PAD + 18, y + 4, n > 0 ? Theme.WHITE : Theme.WARN);
                          y += 17;
                      }
                  }
              }

