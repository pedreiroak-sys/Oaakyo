          package com.novaclient;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.List;

          /**
           * Desenha o HUD: cada elemento fica onde o jogador colocou (ver HudEditorScreen).
           */
          public final class HudRenderer {
              private static long windowStart = System.nanoTime();
              private static int frames = 0;
              private static int fps = 0;

              private static final ArrayDeque<Long> LEFT_CLICKS = new ArrayDeque<>();
              private static final ArrayDeque<Long> RIGHT_CLICKS = new ArrayDeque<>();
              private static boolean lastAttack = false;
              private static boolean lastUse = false;

              private static double lastX = 0;
              private static double lastZ = 0;
              private static boolean hasLast = false;
              private static double speed = 0;

              private HudRenderer() {
              }

              public static int fps() {
                  return fps;
              }

              public static int leftCps() {
                  return LEFT_CLICKS.size();
              }

              public static int rightCps() {
                  return RIGHT_CLICKS.size();
              }

              public static double speed() {
                  return speed;
              }

              // ------------------------------------------------------------------ tick

              /** Chamado a cada tick: conta cliques (CPS) e mede a velocidade. */
              public static void tick(MinecraftClient mc) {
                  long now = System.currentTimeMillis();
                  boolean atk = mc.currentScreen == null && mc.options.attackKey.isPressed();
                  boolean use = mc.currentScreen == null && mc.options.useKey.isPressed();
                  if (atk && !lastAttack) {
                      LEFT_CLICKS.addLast(now);
                  }
                  if (use && !lastUse) {
                      RIGHT_CLICKS.addLast(now);
                  }
                  lastAttack = atk;
                  lastUse = use;
                  prune(LEFT_CLICKS, now);
                  prune(RIGHT_CLICKS, now);

                  if (mc.player == null) {
                      hasLast = false;
                      speed = 0;
                      return;
                  }
                  double x = mc.player.getX();
                  double z = mc.player.getZ();
                  if (hasLast) {
                      double dx = x - lastX;
                      double dz = z - lastZ;
                      double s = Math.sqrt(dx * dx + dz * dz) * 20.0;
                      speed += (s - speed) * 0.3;
                  }
                  lastX = x;
                  lastZ = z;
                  hasLast = true;
              }

              private static void prune(ArrayDeque<Long> q, long now) {
                  while (!q.isEmpty() && now - q.peekFirst() > 1000L) {
                      q.pollFirst();
                  }
              }

              private static void updateFps() {
                  frames++;
                  long now = System.nanoTime();
                  if (now - windowStart >= 1_000_000_000L) {
                      fps = frames;
                      frames = 0;
                      windowStart = now;
                  }
              }

              // ------------------------------------------------------------------ render

              public static void render(DrawContext ctx, float tickDelta) {
                  updateFps();

                  MinecraftClient mc = MinecraftClient.getInstance();
                  NovaConfig cfg = NovaConfig.INSTANCE;

                  if (mc.player == null || mc.world == null || mc.options.hudHidden || mc.options.debugEnabled) {
                      return;
                  }
                  if (mc.currentScreen instanceof HudEditorScreen) {
                      return;
                  }

                  drawCrosshair(ctx, mc, cfg);

                  if (!cfg.hudEnabled) {
                      return;
                  }

                  float scale = cfg.hudScalePercent / 100f;
                  float vw = ctx.getScaledWindowWidth() / scale;
                  float vh = ctx.getScaledWindowHeight() / scale;

                  ctx.getMatrices().push();
                  ctx.getMatrices().scale(scale, scale, 1f);
                  drawAll(ctx, mc, false, vw, vh);
                  ctx.getMatrices().pop();

                  // waypoints no mundo (sem a escala do HUD)
                  if (cfg.waypointsInWorld) {
                      Waypoints.renderWorld(ctx, mc);
                  }
              }

              /**
               * Desenha todos os elementos nas posições configuradas e guarda a área de cada um.
               * No editor, elementos desligados aparecem como um retângulo vazio para poderem ser ligados.
               */
              public static void drawAll(DrawContext ctx, MinecraftClient mc, boolean editor, float vw, float vh) {
                  boolean pv = editor || mc.player == null;
                  for (HudElement el : HudElements.ALL) {
                      NovaConfig.Slot s = el.slot();
                      if (el.hidden()) {
                          el.bw = 0;
                          el.bh = 0;
                          continue;
                      }
                      if (!s.on && !editor) {
                          el.bw = 0;
                          el.bh = 0;
                          continue;
                      }
                      el.measure(mc, pv);
                      int w = el.width();
                      int h = el.height();
                      if (w <= 0 || h <= 0) {
                          if (!editor) {
                              el.bw = 0;
                              el.bh = 0;
                              continue;
                          }
                          w = 40;
                          h = 15;
                      }
                      float sc = s.scale / 100f;
                      int sw = Math.round(w * sc);
                      int sh = Math.round(h * sc);
                      int x = Math.round((vw - sw) * s.ax / 2f) + s.dx;
                      int y = Math.round((vh - sh) * s.ay / 2f) + s.dy;
                      x = Math.max(0, Math.min(Math.max(0, Math.round(vw) - sw), x));
                      y = Math.max(0, Math.min(Math.max(0, Math.round(vh) - sh), y));
                      el.bx = x;
                      el.by = y;
                      el.bw = sw;
                      el.bh = sh;

                      ctx.getMatrices().push();
                      ctx.getMatrices().translate(x, y, 0);
                      ctx.getMatrices().scale(sc, sc, 1f);
                      if (s.on && el.width() > 0 && el.height() > 0) {
                          el.draw(ctx, mc, pv);
                      } else {
                          ctx.fill(0, 0, w, h, 0x44000000);
                          ctx.drawText(mc.textRenderer, el.title, 3, (h - 8) / 2, 0xFF8A8A98, false);
                      }
                      ctx.getMatrices().pop();
                  }
              }

              // ------------------------------------------------------------------ mira

              private static void drawCrosshair(DrawContext ctx, MinecraftClient mc, NovaConfig cfg) {
                  if (!cfg.crosshairEnabled || !mc.options.getPerspective().isFirstPerson()) {
                      return;
                  }
                  int cx = ctx.getScaledWindowWidth() / 2;
                  int cy = ctx.getScaledWindowHeight() / 2;
                  int color = Theme.color(cfg.crosshairColor);
                  if (cfg.crosshairTargetColor && mc.targetedEntity != null) {
                      color = 0xFFFF3B3B;
                  }
                  int t = cfg.crosshairThick;
                  int size = cfg.crosshairSize;
                  int gap = cfg.crosshairGap;
                  int x0 = cx - t / 2;
                  int y0 = cy - t / 2;

                  List<int[]> r = new ArrayList<>();
                  switch (cfg.crosshairStyle) {
                      case 1 -> addDot(r, cx, cy, t);
                      case 3 -> {
                          r.add(new int[]{cx - size, cy - size, cx + size, cy - size + t});
                          r.add(new int[]{cx - size, cy + size - t, cx + size, cy + size});
                          r.add(new int[]{cx - size, cy - size + t, cx - size + t, cy + size - t});
                          r.add(new int[]{cx + size - t, cy - size + t, cx + size, cy + size - t});
                      }
                      default -> {
                          r.add(new int[]{x0, y0 - gap - size, x0 + t, y0 - gap});
                          r.add(new int[]{x0, y0 + t + gap, x0 + t, y0 + t + gap + size});
                          r.add(new int[]{x0 - gap - size, y0, x0 - gap, y0 + t});
                          r.add(new int[]{x0 + t + gap, y0, x0 + t + gap + size, y0 + t});
                          if (cfg.crosshairStyle == 2) {
                              addDot(r, cx, cy, t);
                          }
                      }
                  }
                  if (cfg.crosshairOutline) {
                      for (int[] a : r) {
                          ctx.fill(a[0] - 1, a[1] - 1, a[2] + 1, a[3] + 1, 0xFF000000);
                      }
                  }
                  for (int[] a : r) {
                      ctx.fill(a[0], a[1], a[2], a[3], color);
                  }

                  // indicador de recarga do ataque
                  if (cfg.crosshairCooldown && mc.player != null) {
                      float p = mc.player.getAttackCooldownProgress(0f);
                      if (p < 1f) {
                          int bw = 24;
                          int bx = cx - bw / 2;
                          int by = cy + size + gap + 8;
                          ctx.fill(bx - 1, by - 1, bx + bw + 1, by + 3, 0xFF000000);
                          ctx.fill(bx, by, bx + Math.round(bw * p), by + 2, Theme.accent());
                      }
                  }
              }

              private static void addDot(List<int[]> r, int cx, int cy, int t) {
                  int d = t + 1;
                  int x = cx - d / 2;
                  int y = cy - d / 2;
                  r.add(new int[]{x, y, x + d, y + d});
              }
          }
